    var promise = null;
    try { promise = A[helper](id, meta); } catch (e) { promise = null; }

    publishing = true;
    var done = function (ok, payload) {
      publishing = false;
      closeSheet();
      if (ok) {
        var rec = addPublished(type, id, meta, payload);
        emit('published', rec);
        toast('Опубликовано');
        refreshPublishedUI();
      } else {
        /* Api уже показал тост «нет связи с сервером». */
        emit('publishfailed', { type: type, id: id });
      }
    };
    if (!promise) { done(false, null); return; }
    settle(promise, function (data) { done(true, data); }, function () { done(false, null); });
  }

  /* ------------------------------------------------------------------ */
  /* Статистика                                                          */
  /* ------------------------------------------------------------------ */

  function chip(iconHtml, value, label, attrs) {
    return '<span class="stat-chip" data-stat="' + esc(label) + '">' +
      iconHtml + '<b>' + esc(value) + '</b>' + (attrs || '') + '</span>';
  }

  function statsFor(key) {
    var resolved = resolveKey(key);
    if (!resolved) return ''; // статистика только для опубликованного
    var st = readStats(resolved);
    var rk = esc(resolved.key);
    var html = '<div class="stat-row" data-stat-row="' + rk + '">';
    html += chip(statIcon('download', 16, 'download'), st.downloads, 'downloads');
    html += chip(statIcon('play', 16, 'play'), st.plays, 'plays');
    html += '<button type="button" class="stat-chip stat-like" data-stat="likes" ' +
      'data-stat-like="' + rk + '" aria-label="Лайк">' +
      statIcon('heart', 16, 'heart') + '<b>' + esc(st.likes) + '</b></button>';
    html += '<button type="button" class="stat-chip stat-comment" data-stat="comments" ' +
      'data-stat-comment="' + rk + '" aria-label="Комментарий">' +
      statIcon('comment', 16, 'message') + '<b>' + esc(st.comments) + '</b></button>';
    html += '</div>';
    return html;
  }

  function statAction(kind, key) {
    var resolved = resolveKey(key);
    if (!resolved) return;
    if (!loggedIn()) {
      toast('Нужен аккаунт');
      openAuth();
      return;
    }
    var text = '';
    if (kind === 'comment') {
      text = window.prompt ? String(window.prompt('Комментарий:') || '') : '';
      if (!text.replace(/^\s+|\s+$/g, '')) return;
    }

    var path = '/api/published/' + resolved.type + '/' + encodeURIComponent(resolved.id) +
      '/' + (kind === 'like' ? 'like' : 'comment');
    var body = { token: authToken() };
    if (kind === 'comment') {
      body.text = text.slice(0, 1000);
      body.comment = body.text;
    }

    var A = api();
    if (A && typeof A.request === 'function' && apiOnline(A)) {
      /* Api.request сам обновляет syncQueue и показывает «нет связи». */
      try {
        settle(A.request(path, { method: 'POST', body: body }), function () {}, function () {});
      } catch (e) { /* локальный счётчик всё равно обновим */ }
    }

    /* Оптимистичный локальный инкремент — счётчик жив даже без сети. */
    var all = state().stats || (state().stats = {});
    var field = kind === 'like' ? 'likes' : 'comments';
    var target = all[resolved.key] ? resolved.key : resolved.fieldKey;
    var bucket = statsBucket(target);
    bucket[field] = Math.max(0, Math.round(num(bucket[field], 0))) + 1;
    if (typeof core().save === 'function') core().save();
    emit('stats', { key: target, stats: bucket });
    refreshStatsUI();
  }

  function maybeFetchStats(resolved) {
    var A = api();
    if (!A || typeof A.request !== 'function' || !apiOnline(A)) return;
    var now = Date.now();
    if (statFetched[resolved.key] && now - statFetched[resolved.key] < 30000) return;
    statFetched[resolved.key] = now;
    if (typeof A.stat !== 'function') return;
    var promise = null;
    try { promise = A.stat(resolved.key); } catch (e) { promise = null; }
    if (!promise) return;
    settle(promise, function (data) {
      if (!data || typeof data !== 'object') return;
      var s = state();
      if (!s.stats || typeof s.stats !== 'object') s.stats = {};
      var bucket = statsBucket(resolved.key);
      var changed = false;
      var fields = ['downloads', 'plays', 'likes', 'comments'];
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];
        if (data[f] == null) continue;
        var v = Math.max(0, Math.round(num(data[f], 0)));
        if (v > bucket[f]) { bucket[f] = v; changed = true; }
      }
      if (changed) {
        if (typeof core().save === 'function') core().save();
        refreshStatsUI();
      }
    }, function () { /* статистика необязательна */ });
  }

  function injectScreenStats(name, id) {
    if (!doc || !doc.querySelector || id == null) return;
    var screen = doc.querySelector('[data-screen="' + name + '"]');
    if (!screen) return;
    var type = name === 'playlist' ? 'playlist' : 'song';
    var key = keyOf(type, id);
    var resolved = resolveKey(key);

    var host = screen.querySelector ? screen.querySelector('[data-discover-stats]') : null;
    if (!host) {
      host = doc.createElement('div');
      host.className = 'discover-screen-stats';
      host.setAttribute('data-discover-stats', key);
      var anchor = screen.querySelector('.tm-meta-chips') || screen.querySelector('.tm-actions') ||
        screen.querySelector('.tm-head') || screen.firstChild;
      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(host, anchor.nextSibling);
      else screen.appendChild(host);
    }
    host.setAttribute('data-discover-stats', key);
    host.innerHTML = statsFor(key) + (resolved ? '' : publishButton(type, id));
    if (resolved) maybeFetchStats(resolved);
  }

  function routeHandler(info) {
    try { injectHomeBar(); } catch (e) { /* ignore */ }
    var payload = info || {};
    var name = String(payload.screen || (core() && core().state && core().state.route) || '');
    var params = payload.params || (core() && core().state && core().state.routeParams) || {};
    if (name === 'track' || name === 'playlist') {
      if (params.id != null) injectScreenStats(name, params.id);
    }
  }

  function refreshStatsUI() {
    if (!doc || !doc.querySelectorAll) return;
    var rows = doc.querySelectorAll('[data-stat-row]');
    for (var i = 0; i < rows.length; i++) {
      var key = rows[i].getAttribute('data-stat-row');
      if (!key) continue;
      var html = statsFor(key);
      if (!html) continue;
      try { rows[i].outerHTML = html; } catch (e) { /* ignore */ }
    }
  }

  function refreshPublishedUI() {
    if (lastQuery) search(lastQuery);
    else renderResults(emptyResults(), '', '');
    var current = core() && core().state ? core().state : {};
    if (current.route === 'track' || current.route === 'playlist') {
      var id = (current.routeParams || {}).id;
      if (id != null) injectScreenStats(current.route, id);
    }
  }

  /* ------------------------------------------------------------------ */
  /* Delegated events + init                                             */
  /* ------------------------------------------------------------------ */

  function onClick(event) {
    var target = event.target;
    if (!target || !target.getAttribute) return;

    function closestAttr(attr) {
      var node = target;
      while (node && node !== doc) {
        if (node.getAttribute && node.getAttribute(attr) !== null) return node;
        node = node.parentNode;
      }
      return null;
    }

    var el;

    /* Публикация: шторка */
    el = closestAttr('data-pub-cancel');
    if (el && sheet) {
      if (event.preventDefault) event.preventDefault();
      closeSheet();
      return;
    }
    el = closestAttr('data-pub-confirm');
    if (el && sheet) {
      if (event.preventDefault) event.preventDefault();
      confirmPublish();
      return;
    }

    el = closestAttr('data-discover-clear');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      clearSearch();
      return;
    }
    el = closestAttr('data-discover-artist');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      var artist = String(el.getAttribute('data-discover-artist') || '');
      var input = homeScreen() && homeScreen().querySelector('[data-discover-input]');
      if (input) input.value = artist;
      search(artist);
      return;
    }
    el = closestAttr('data-discover-play');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      playSong(el.getAttribute('data-discover-play'));
      return;
    }
    el = closestAttr('data-discover-offline');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      toast('Трека нет на устройстве');
      return;
    }
    el = closestAttr('data-discover-open');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      openCard(el.getAttribute('data-discover-open'));
      return;
    }
    el = closestAttr('data-discover-publish');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      var pair = String(el.getAttribute('data-discover-publish') || '').split('|');
      publish(pair[0], pair.slice(1).join('|'));
      return;
    }
    el = closestAttr('data-stat-like');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      statAction('like', el.getAttribute('data-stat-like'));
      return;
    }
    el = closestAttr('data-stat-comment');
    if (el) {
      if (event.preventDefault) event.preventDefault();
      statAction('comment', el.getAttribute('data-stat-comment'));
      return;
    }
  }

  function onGlobalKeydown(event) {
    if (!sheet) return;
    if (event.key === 'Escape' || event.keyCode === 27) {
      if (event.preventDefault) event.preventDefault();
      closeSheet();
    }
  }

  function init() {
    var C = core();
    if (inited) return Discover;
    if (!C || !doc || typeof doc.querySelector !== 'function') return Discover;
    inited = true;

    if (typeof C.on === 'function') {
      unsubs.push(C.on('route', routeHandler));
      unsubs.push(C.on('library', function () {
        try {
          injectHomeBar();
          var s = state();
          if ((s.route === 'track' || s.route === 'playlist') && (s.routeParams || {}).id != null) {
            injectScreenStats(s.route, s.routeParams.id);
          }
        } catch (e) { /* ignore */ }
      }));
      unsubs.push(C.on('published', function () {
        try { refreshPublishedUI(); } catch (e) { /* ignore */ }
      }));
      unsubs.push(C.on('stats', function () {
        try { refreshStatsUI(); } catch (e) { /* ignore */ }
      }));
      unsubs.push(C.on('online', function () {
        if (lastQuery) search(lastQuery);
      }));
      unsubs.push(C.on('account', function () {
        try { refreshPublishedUI(); } catch (e) { /* ignore */ }
      }));
    }

      doc.addEventListener('input', onInput, false);
      doc.addEventListener('click', onClick, false);
      doc.addEventListener('keydown', onGlobalKeydown, false);

    routeHandler({ screen: state().route || 'home', params: state().routeParams || {} });
    return Discover;
  }

  var Discover = {
    init: init,
    publish: publish,
    search: search,
    homeBarHtml: homeBarHtml,
    statsFor: statsFor,
    /* Вспомогательное (для координатора и тестов), в контракте не значится: */
    closeSheet: closeSheet,
    isLoggedIn: loggedIn

  modules.Discover = Discover;
  TheMusic.Discover = Discover;
  window.TheMusic = TheMusic;
})();

      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
    } catch (e) { /* ignore */ }
    return empty;
  }

  function closestAttr(node, attr) {
    while (node && node !== document) {
      if (node.getAttribute && node.getAttribute(attr) !== null) return node;
      node = node.parentNode;
    }
    return null;
  }

  function warn(prefix, error) {
    if (window.console && typeof window.console.warn === 'function') {
      window.console.warn('[TheMusic] ' + prefix, error && error.message ? error.message : error);
    }
  }

  /* i18n опционален: если модуль не подключён — остаётся русский fallback. */
  function t(key, fallback) {
    var i18n = TheMusic.modules && TheMusic.modules.I18n;
    if (i18n && typeof i18n.t === 'function') {
      try {
        var value = i18n.t(key, fallback);
        if (value !== null && value !== undefined && value !== '') return String(value);
      } catch (e) { warn('I18n.t ' + key, e); }
    }
    return fallback;
  }

  function moduleCall(name, method, args) {
    var mod = TheMusic.modules && TheMusic.modules[name];
    if (!mod || typeof mod[method] !== 'function') return false;
    try {
      mod[method].apply(mod, args || []);
      return true;
    } catch (e) {
      warn(name + '.' + method, e);
      return false;
    }
  }

  function applyTheme() {
    var settings = Core.state.settings || {};
    var theme = THEMES[settings.theme] ? settings.theme : 'midnight';
    var root = document.documentElement;
    if (root) {
      root.setAttribute('data-theme', theme);
      var reduce = !!settings.reduceMotion;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) reduce = true;
      root.classList.toggle('reduce-motion', reduce);
      root.setAttribute('data-motion', reduce ? 'reduced' : 'full');
    }
    if (document.body) document.body.classList.toggle('reduce-motion', !!settings.reduceMotion);
  }

  function playerCall(method, args, fallback) {
    var player = TheMusic.Player;
    if (player && typeof player[method] === 'function') {
      try {
        return player[method].apply(player, args || []);
      } catch (e) {
        warn('Player.' + method, e);
      }
    }
    return typeof fallback === 'function' ? fallback() : fallback;
  }

  function togglePlay() {
    if (TheMusic.Player && typeof TheMusic.Player.toggle === 'function') {
      return playerCall('toggle');
    }
    return Core.state.player.playing ? Core.native('pause') : Core.native('resume');
  }

  function parseParams(raw) {
    if (!raw) return {};
    var parsed = parseObject(raw, null);
    return parsed && typeof parsed === 'object' ? parsed : {};
  }

  function handleAction(action, event) {
    switch (String(action || '')) {
      case 'toggle':
      case 'playpause':
      case 'play-pause':
        togglePlay();
        break;
      case 'next':
        playerCall('next', [], function () { return Core.native('next'); });
        break;
      case 'prev':
      case 'previous':
        playerCall('prev', [], function () { return Core.native('previous'); });
        break;
      case 'back':
        Core.back();
        break;
      case 'player':
        Core.go('player');
        break;
      case 'settings':
        Core.go('settings');
        break;
      case 'fav':
      case 'favorite':
        if (Core.state.player.currentId) Core.toggleFav(Core.state.player.currentId);
        break;
      case 'close':
        Core.back();
        break;
      default:
        return false;
    }
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    return true;
  }

  function bindUI() {
    on(document, 'click', function (event) {
      var target = event.target;
      var goEl = closestAttr(target, 'data-go');
      if (goEl) {
        if (event.preventDefault) event.preventDefault();
        Core.go(goEl.getAttribute('data-go'), parseParams(goEl.getAttribute('data-params')));
        return;
      }
      var actionEl = closestAttr(target, 'data-action');
      if (actionEl && handleAction(actionEl.getAttribute('data-action'), event)) return;
      var backEl = closestAttr(target, 'data-back');
      if (backEl) {
        if (event.preventDefault) event.preventDefault();
        Core.back();
        return;
      }
      var miniEl = closestAttr(target, 'data-mini');
      if (miniEl) {
        if (event.preventDefault) event.preventDefault();
        handleAction(miniEl.getAttribute('data-mini'), event);
        return;
      }
      var mini = byId('mini-player');
      if (mini && (target === mini || mini.contains && mini.contains(target))) Core.go('player');
    });

    on(document, 'keydown', function (event) {
      var target = event.target;
      if (target && (
        target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
        target.tagName === 'SELECT' || target.isContentEditable
      )) return;
      var key = event.key || '';
      if (key === ' ' || event.keyCode === 32) {
        if (event.preventDefault) event.preventDefault();
        togglePlay();
      } else if (key === 'ArrowRight') {
        if (event.preventDefault) event.preventDefault();
        playerCall('next', [], function () { return Core.native('next'); });
      } else if (key === 'ArrowLeft') {
        if (event.preventDefault) event.preventDefault();
        playerCall('prev', [], function () { return Core.native('previous'); });
      } else if (key === 'ArrowUp' || key === 'ArrowDown') {
        if (event.preventDefault) event.preventDefault();
        var delta = key === 'ArrowUp' ? 0.05 : -0.05;
        var volume = Math.max(0, Math.min(1, Number(Core.state.settings.volume || 0) + delta));
        Core.state.settings.volume = Math.round(volume * 100) / 100;
        Core.native('setVolume', Core.state.settings.volume);
        Core.save();
        Core.emit('state', Core.state);
      } else if (key === 'Escape' || event.keyCode === 27) {
        if (Core.state.route !== 'home') {
          if (event.preventDefault) event.preventDefault();
          Core.back();
        }
      }
    });

    on(window, 'resize', function () { renderMini(); });
  }

  function safeInit(moduleName, method) {
    var module = TheMusic.modules[moduleName] || TheMusic[moduleName];
    if (!module || typeof module[method] !== 'function') return false;
    try {
      module[method]();
      return true;
    } catch (e) {
      warn(moduleName + '.' + method, e);
      Core.emit('error', moduleName + '.' + method + ': ' + (e && e.message ? e.message : e));
      return false;
    }
  }

  /* Порядок строго по CONTRACT_V2 §2 (кроме main). safeInit терпимо относится
     к отсутствующему модулю, так что бандл работает и с частью модулей. */
  function initModules() {
    safeInit('I18n', 'init');
    safeInit('IconPack', 'init');
    safeInit('Theme', 'init');
    safeInit('Api', 'init');
    safeInit('Account', 'init');
    safeInit('Auth', 'init');
    safeInit('Catalog', 'install');
    safeInit('Decoder', 'init');
    safeInit('Library', 'init');
    safeInit('Player', 'init');
    safeInit('Notes', 'init');
    safeInit('Avatar', 'init');
    safeInit('AutoPlaylists', 'init');
    safeInit('Plays', 'init');
    safeInit('Gestures', 'init');
    safeInit('Discover', 'init');
  }

  function ensureScreens() {
    var host = byId('screens');
    if (!host) return;
    for (var name in SCREENS) {
      if (!hasOwn(SCREENS, name)) continue;
      if (document.querySelector('[data-screen="' + name + '"]')) continue;
      var section = document.createElement('section');
      section.className = 'screen';
      section.setAttribute('data-screen', name);
      section.innerHTML = '<header class="screen-head"><h1>' +
        Core.esc(t('screen.' + name, SCREENS[name])) +
        '</h1></header><div class="screen-body empty">' +
        Core.esc(t('common.maintenance', 'Раздел загружается…')) + '</div>';
      host.appendChild(section);
    }
  }

  /* Секции создают и library.js, и decoder.js, и player.js. Всегда берём
     актуальный узел из DOM, а не кэшированный при первом рендере. */
  function settingsScreen() {
    var screen = document.querySelector('[data-screen="settings"]');
    if (!screen) {
      ensureScreens();
      screen = document.querySelector('[data-screen="settings"]');
    }
    return screen || null;
  }

  /* Обновляем только «родные» заголовки заглушек — чужие экраны не трогаем. */
  function updateScreenHeadings() {
    for (var name in SCREENS) {
      if (!hasOwn(SCREENS, name)) continue;
      var node = document.querySelector('[data-screen="' + name + '"] .screen-head h1');
      if (node) node.textContent = t('screen.' + name, SCREENS[name]);
    }
  }

  /* Нижняя навигация. В v1 её никто не создавал — отсюда «чёрный экран»
     без кнопок. Собираем её сами и вешаем на уже существующий delegated-click. */
  function renderTabbar() {
    var bar = byId('tabbar');
    if (!bar) return;
    var items = [
      { go: 'home', icon: 'home', label: t('tab.home', 'Главная') },
      { go: 'library', icon: 'library', label: t('tab.library', 'Медиатека') },
      { go: 'search', icon: 'search', label: t('tab.search', 'Поиск') },
      { go: 'playlists', icon: 'playlist', label: t('tab.playlists', 'Плейлисты') },
      { go: 'decoder', icon: 'decoder', label: t('tab.decoder', 'Декодер') }
    ];
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<button type="button" class="tab-item" data-go="' + it.go + '" ' +
        'data-tab="' + it.go + '" aria-label="' + Core.esc(it.label) + '">' +
        '<span class="tab-ico">' + Core.icon(it.icon) + '</span>' +
        '<span class="tab-label">' + Core.esc(it.label) + '</span></button>';
    }
    var settingsLabel = t('tab.settings', 'Настройки');
    html += '<button type="button" class="tab-item tab-settings" data-action="settings" ' +
      'aria-label="' + Core.esc(settingsLabel) + '"><span class="tab-ico">' +
      Core.icon('settings') + '</span><span class="tab-label">' +
      Core.esc(settingsLabel) + '</span></button>';
    bar.innerHTML = html;
    bar.setAttribute('data-ready', '1');
  }

  function syncTabbar() {
    var bar = byId('tabbar');
    if (!bar) return;
    var nodes = bar.querySelectorAll('[data-tab]');
    for (var i = 0; i < nodes.length; i++) {
      var active = nodes[i].getAttribute('data-tab') === Core.state.route ||
        (Core.state.route === 'playlist' && nodes[i].getAttribute('data-tab') === 'playlists') ||
        (Core.state.route === 'track' && nodes[i].getAttribute('data-tab') === 'library') ||
        (Core.state.route === 'favorites' && nodes[i].getAttribute('data-tab') === 'library') ||
        (Core.state.route === 'player' && nodes[i].getAttribute('data-tab') === 'home');
      if (nodes[i].classList) nodes[i].classList.toggle('active', !!active);
    }
  }

  function toggleSetting(key, label, hint, icon) {
    var on = !!Core.state.settings[key];
    return '<button type="button" class="set-row" data-setting="' + key + '" ' +
      'aria-pressed="' + on + '">' +
      '<span class="set-ico">' + Core.icon(icon || 'sparkles') + '</span>' +
      '<span class="set-text"><b>' + Core.esc(label) + '</b>' +
      (hint ? '<small>' + Core.esc(hint) + '</small>' : '') + '</span>' +
      '<span class="set-switch' + (on ? ' on' : '') + '"><i></i></span></button>';
  }

    var html = '<div class="set-head"><h1 class="title">' +

    for (var m = 0; m < modes.length; m++) {

      '<span class="set-text"><b>' + Core.esc(t('settings.playlistsCount', 'Плейлистов')) +
      '</b></span><span class="set-val">' + (Core.state.playlists || []).length + '</span></div>' +

    html += '<p class="muted set-foot">' +

  function bindSettings() {
    var screen = settingsScreen();
    if (!screen) return;
    /* Если секцию пересоздали другие модули — старый data-bound висит на
       отсоединённом узле, поэтому проверяем и сам узел тоже. */
    if (screen.getAttribute('data-bound') && boundSettingsScreen === screen) return;
    boundSettingsScreen = screen;
    screen.setAttribute('data-bound', '1');
    screen.addEventListener('click', function (event) {
      var langBtn = closestAttr(event.target, 'data-lang');
      if (langBtn) {
        var lang = langBtn.getAttribute('data-lang') === 'en' ? 'en' : 'ru';
        Core.state.settings.language = lang;
        Core.save();
        moduleCall('I18n', 'setLanguage', [lang]);
        renderTabbar();
        updateScreenHeadings();
        renderSettings();
        Core.emit('language', lang);
        Core.emit('state', Core.state);
        Core.toast(lang === 'ru' ? 'Русский язык включён' : 'English enabled');
        return;
      }
      var modeBtn = closestAttr(event.target, 'data-theme-mode');
      if (modeBtn) {
        var mode = modeBtn.getAttribute('data-theme-mode');
        if (mode !== 'light' && mode !== 'system') mode = 'dark';
        Core.state.settings.themeMode = mode;
        Core.save();
        moduleCall('Theme', 'setMode', [mode]);
        applyTheme();
        renderSettings();
        Core.emit('thememode', mode);
        Core.emit('state', Core.state);
        return;
      }
      var row = closestAttr(event.target, 'data-setting');
      if (row) {
        var key = row.getAttribute('data-setting');
        Core.state.settings[key] = !Core.state.settings[key];
        Core.save();
        renderSettings();
        if (key === 'splash') {
          document.documentElement.classList.toggle('no-splash', !Core.state.settings.splash);
          Core.toast(Core.state.settings.splash ? 'Стартап-экран включён' : 'Стартап-экран выключен');
        } else if (key === 'reduceMotion') {
          applyTheme();
        } else if (key === 'backgroundPlay') {
          try { Core.native('keepAlive', !!Core.state.settings.backgroundPlay); } catch (e) { /* offline */ }
          Core.emit('backgroundplay', !!Core.state.settings.backgroundPlay);
          Core.emit('state', Core.state);
        } else {
          Core.emit('state', Core.state);
        }
        return;
      }
      var themeBtn = closestAttr(event.target, 'data-theme-set');
      if (themeBtn) {
        Core.state.settings.theme = themeBtn.getAttribute('data-theme-set');
        Core.save();
        applyTheme();
        renderSettings();
        Core.emit('theme', Core.state.settings.theme);
        return;
      }
      var rescan = closestAttr(event.target, 'data-action');
      if (rescan && rescan.getAttribute('data-action') === 'rescan') {
        Core.emit('ready', { source: 'rescan' });
        Core.toast('Медиатека обновляется…');
      }
    });
  }

  function normalizeTrack(raw) {
    if (!raw || !raw.id) return null;
    return {
      id: String(raw.id),
      title: String(raw.title || t('common.emptyTrackName', 'Без названия')),
      artist: String(raw.artist || t('common.emptyArtist', 'Неизвестно')),
      album: String(raw.album || ''),
      duration: Number(raw.duration) || 0,
      path: String(raw.path || ''),
      size: Number(raw.size) || 0,
      mime: String(raw.mime || 'audio/*'),
      year: Number(raw.year) || 0,
      trackNo: Number(raw.trackNo) || 0,
      source: raw.source === 'demo' ? 'demo' : 'device'
    };
  }

  function mergeTracks(list) {
    if (!Array.isArray(list)) return 0;
    var tracks = Core.state.tracks || (Core.state.tracks = []);
    var seen = {};
    for (var i = 0; i < tracks.length; i++) {
      if (tracks[i] && tracks[i].id) seen[String(tracks[i].id)] = 1;
    }
    var added = 0;
    for (var j = 0; j < list.length; j++) {
      var track = normalizeTrack(list[j]);
      if (!track || seen[track.id]) continue;
      seen[track.id] = 1;
      tracks.push(track);
      added++;
    }
    if (added) Core.save();
    Core.emit('library', tracks);
    return added;
  }

  function syncFromNative(value) {
    var nativeState = parseObject(value, null);
    if (!nativeState) return;
    var player = Core.state.player;
    if (typeof nativeState.playing === 'boolean') player.playing = nativeState.playing;
    if (typeof nativeState.position === 'number' && isFinite(nativeState.position)) {
      player.position = Math.max(0, nativeState.position);
    }
    if (typeof nativeState.duration === 'number' && nativeState.duration > 0) {
      player.duration = nativeState.duration;
    }
    if (typeof nativeState.shuffle === 'boolean') {
      Core.state.settings.shuffle = nativeState.shuffle;
    }
    if (typeof nativeState.repeat === 'number') {
      Core.state.settings.repeat = Math.max(0, Math.min(2, nativeState.repeat));
    }
    var current = nativeState.current || null;
    if (current && current.id) {
      var id = String(current.id);
      player.currentId = id;
      if (!Core.getTrack(id)) mergeTracks([current]);
      if (!player.duration && current.duration) player.duration = Number(current.duration) || 0;
    }
  }

  function updateCounters(info) {
    var counts = {
      tracks: (Core.state.tracks || []).length,
      favorites: (Core.state.favorites || []).length,
      playlists: (Core.state.playlists || []).length
    };
    if (info && typeof info.tracks === 'number') counts.device = info.tracks;
    for (var key in counts) {
      if (!hasOwn(counts, key)) continue;
      var nodes = document.querySelectorAll('[data-count="' + key + '"]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = String(counts[key]);
    }
    var tabbar = byId('tabbar');
    if (tabbar) {
      tabbar.setAttribute('data-tracks', String(counts.tracks));
      tabbar.setAttribute('data-favorites', String(counts.favorites));
      tabbar.setAttribute('data-playlists', String(counts.playlists));
    }
    var badge = document.querySelector('[data-device-count]');
    if (badge && info) badge.textContent = String(info.tracks || counts.tracks);
  }

  function renderMini() {
    var mini = byId('mini-player');
    if (!mini) return;
    var player = Core.state.player || {};
    var track = Core.getTrack(player.currentId);
    if (!track) {
      if (mini.classList) mini.classList.add('hidden');
      mini.setAttribute('aria-hidden', 'true');
      return;
    }
    if (mini.classList) mini.classList.remove('hidden');
    mini.removeAttribute('aria-hidden');
    if (!mini.getAttribute('data-built') && !(mini.innerHTML || '').trim()) {
      mini.innerHTML =
        '<div class="mini-art" data-mini-art></div>' +
        '<div class="mini-info"><b data-mini-title></b><small data-mini-artist></small></div>' +
        '<div class="mini-actions">' +
        '<button type="button" class="icon-btn" data-mini="toggle" aria-label="Воспроизведение">' + Core.icon('play') + '</button>' +
        '<button type="button" class="icon-btn" data-mini="next" aria-label="Следующий">' + Core.icon('next') + '</button>' +
        '</div>';
      mini.setAttribute('data-built', '1');
    }
    var setText = function (selector, value) {
      var node = mini.querySelector(selector);
      if (node) node.textContent = value;
    };
    setText('[data-mini-title]', track.title || t('common.emptyTrackName', 'Без названия'));
    setText('[data-mini-artist]', track.artist || t('common.emptyArtist', 'Неизвестно'));
    var toggle = mini.querySelector('[data-mini="toggle"]');
    if (toggle) toggle.innerHTML = Core.icon(player.playing ? 'pause' : 'play');
    var art = mini.querySelector('[data-mini-art]');
    if (art) {
      var color = (Core.state.meta[track.id] || {}).color || '#8b7bff';
      art.style.background = 'linear-gradient(135deg,' + color + ',#4fb3ff)';
    }
  }

  function renderAll() {
    try {
      if (TheMusic.Player && typeof TheMusic.Player.render === 'function') TheMusic.Player.render();
    } catch (e) {
      warn('Player.render', e);
    }
    renderMini();
    hideBoot();
  }

  function hideBoot() {
    if (bootHidden) return;
    bootHidden = true;
    var boot = byId('boot');
    if (!boot) return;
    if (boot.classList) boot.classList.add('gone');
    boot.setAttribute('aria-hidden', 'true');
    window.setTimeout(function () {
      if (boot.parentNode) boot.style.display = 'none';
    }, 420);
  }

  function onReady(data) {
    var force = !!(data && data.source === 'rescan');
    if (readyFired && !force) return;
    readyFired = true;

    var info = parseObject(Core.native('getInfo'));
    TheMusic.deviceInfo = info;
    updateCounters(info);

    var scan = parseObject(Core.native('scanLibrary'));
    var list = Array.isArray(scan.tracks) ? scan.tracks : (Array.isArray(scan) ? scan : []);
    mergeTracks(list);
    updateCounters(info);

    syncFromNative(Core.native('getState'));
    Core.emit('library', Core.state.tracks);
    renderAll();
  }

  function bindCoreEvents() {
    Core.on('ready', onReady);

    Core.on('state', function (payload) {
      syncFromNative(payload);
      renderAll();
    });

    Core.on('trackchange', function (track) {
      if (!track) return;
      var normalized = normalizeTrack(track);
      if (!normalized) return;
      if (!Core.getTrack(normalized.id)) mergeTracks([normalized]);
      Core.state.player.currentId = normalized.id;
      if (normalized.duration) Core.state.player.duration = normalized.duration;
      updateCounters(TheMusic.deviceInfo);
      renderAll();
    });

    Core.on('route', function (payload) {
      syncTabbar();
      renderMini();
      var route = Core.state.route;
      if (payload && typeof payload === 'object') {
        route = payload.screen || payload.route || payload.name || route;
      } else if (typeof payload === 'string' && payload) {
        route = payload;
      }
      if (String(route) !== 'settings') return;
      renderSettings();
      bindSettings();
      if (TheMusic.main && typeof TheMusic.main.render === 'function') TheMusic.main.render();
      /* Модули вставляют свой UI в чужие экраны из своих route-хендлеров.
         Догоняющий проход после всех синхронных слушателей не даёт
         заглушке «Раздел загружается…» вернуться на экран настроек. */
      window.setTimeout(function () {
        if (Core.state.route !== 'settings') return;
        renderSettings();
        bindSettings();
      }, 0);
    });

    Core.on('permission', function (granted) {
      if (granted) onReady();
    });

    Core.on('theme', function () {
      applyTheme();
    });
  }

  function startSplash() {
    var root = document.documentElement;
    var boot = byId('boot');
    var enabled = Core.state.settings.splash !== false;
    if (root.classList) root.classList.toggle('no-splash', !enabled);
    if (!boot || !enabled) {
      hideBoot();
      return;
    }
    var status = boot.querySelector('[data-boot-status]');
    var steps = ['настраиваем звук…', 'сканируем медиатеку…', 'разогреваем градиенты…', 'готово'];
    var i = 0;
    var timer = window.setInterval(function () {
      i++;
      if (status && i < steps.length) status.textContent = steps[i];
      if (i >= steps.length) window.clearInterval(timer);
    }, 430);
    window.setTimeout(function () {
      window.clearInterval(timer);
      if (status) status.textContent = 'готово';
      hideBoot();
    }, 1850);
  }

  /* Если WebView не показал ни одного экрана — снимаем тяжёлые эффекты и
     принудительно открываем главную. Это лечит «чёрный экран» на прошивках
     с глючным backdrop-filter / background-clip. */
  function watchdog() {
    window.setTimeout(function () {
      var root = document.documentElement;
      var active = document.querySelector('.screen.active');
      var boot = byId('boot');
      var bootHidden = !boot || (boot.classList && boot.classList.contains('gone')) ||
        (boot.style && boot.style.display === 'none');
      if (!active || !bootHidden) {
        try {
          if (root.classList) root.classList.add('safe-render');
          Core.go('home');
          hideBoot();
          renderAll();
          Core.toast(t('settings.safeMode', 'Включён безопасный режим отрисовки'));
        } catch (e) { warn('watchdog', e); }
      }
    }, 2600);
  }

  function start() {
    Core.load();
    applyTheme();
    /* Сначала каркас экранов и таббар — модули находят свой DOM на init. */
    ensureScreens();
    renderTabbar();
    initModules();
    /* Подтягиваем сохранённые язык/режим темы в сами модули (если есть). */
    var savedLang = Core.state.settings.language;
    if (savedLang === 'ru' || savedLang === 'en') moduleCall('I18n', 'setLanguage', [savedLang]);
    var savedMode = Core.state.settings.themeMode;
    if (savedMode === 'dark' || savedMode === 'light' || savedMode === 'system') {
      moduleCall('Theme', 'setMode', [savedMode]);
    }
    renderTabbar();
    updateScreenHeadings();
    bindUI();
    /* Наш route-хендлер регистрируется ПОСЛЕДНИМ: рендер настроек
       выполняется после инъекций всех модулей, а не до них. */
    bindCoreEvents();
    bindSettings();
    renderSettings();
    syncTabbar();
    Core.go(Core.state.route || 'home', Core.state.routeParams || {});
    Core.emit('ready', { source: 'boot' });
    renderAll();
    startSplash();
    watchdog();
  }

  TheMusic.main = {
    render: renderAll,
    hideBoot: hideBoot,
    applyTheme: applyTheme,
    mergeTracks: mergeTracks
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

</script>
</body>
</html>
