<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<meta name="color-scheme" content="dark">
<title>The Music</title>
<style>/* ============================================================
   THE MUSIC — design system  v1.0
   Mobile-first, offline, no external fonts/assets.
   ============================================================ */

:root {
  /* base palette — тёмная тема по умолчанию */
  --bg: #080812;
  --bg2: #0e0e1c;
  --panel: rgba(20, 20, 38, .78);
  --panel-solid: #141426;
  --glass: rgba(255, 255, 255, .06);
  --glass-hi: rgba(255, 255, 255, .10);
  --fill: rgba(255, 255, 255, .05);
  --fill-soft: rgba(255, 255, 255, .025);
  --fill-strong: rgba(255, 255, 255, .10);
  --stroke: rgba(255, 255, 255, .09);
  --divider: rgba(255, 255, 255, .055);
  --text: #f4f4ff;
  --muted: #9a9ab5;
  --violet: #8b7bff;
  --cyan: #4fb3ff;
  --pink: #ff6ad5;
  --grad: linear-gradient(135deg, var(--violet), var(--cyan), var(--pink));
  --accent: var(--violet);
  --accent-soft: rgba(139, 123, 255, .13);
  --accent-text: #b9adff;
  --on-accent: #0a0a16;
  --glow: rgba(139, 123, 255, .45);
  --glow-cyan: rgba(79, 179, 255, .35);
  --glow-pink: rgba(255, 106, 213, .30);
  --halo-a: rgba(139, 123, 255, .16);
  --halo-b: rgba(79, 179, 255, .11);
  --halo-c: rgba(255, 106, 213, .09);
  --tab-bg: rgba(12, 12, 26, .74);
  --backdrop: rgba(4, 4, 12, .62);
  --sheet-bg: linear-gradient(180deg, rgba(24, 24, 44, .97), rgba(12, 12, 26, .98));
  --modal-bg: rgba(18, 18, 36, .97);
  --toast-bg: rgba(24, 24, 44, .94);
  --field-bg: rgba(255, 255, 255, .045);
  --field-focus: rgba(255, 255, 255, .07);
  --track: rgba(255, 255, 255, .12);
  --handle: rgba(255, 255, 255, .22);
  --placeholder: rgba(154, 154, 181, .70);
  --scroll-thumb: rgba(255, 255, 255, .14);
  --scroll-thumb-2: rgba(255, 255, 255, .13);
  --star-off: rgba(255, 255, 255, .22);
  --star-on: #ffd166;
  --toggle-knob: #e8e8f5;
  --shine: rgba(255, 255, 255, .16);
  --ripple: rgba(255, 255, 255, .35);
  --disc-1: #10101c;
  --disc-2: #1b1b2a;
  --disc-3: #0d0d18;
  --success: #6ee7b7;
  --warning: #fbbf24;
  --danger: #ff6ad5;
  --boot-bg:
    radial-gradient(700px 460px at 30% 20%, rgba(139,123,255,.32), transparent 65%),
    radial-gradient(700px 460px at 75% 80%, rgba(255,106,213,.24), transparent 65%),
    linear-gradient(160deg, #0d0d20, #080812 60%);
  --boot-tagline: #b9b7d6;
  --boot-status: #77769a;
  --boot-logo: #d7d0ff;
  --edge-shade: rgba(0, 0, 0, .35);
  --noise-opacity: .055;
  --noise-line: rgba(190, 190, 240, .55);
  --radius: 22px;
  --tabh: 66px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --pad: 16px;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --shadow-soft: 0 10px 30px rgba(0, 0, 0, .18);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --theme-ms: 260ms;
}

/* ---------- полная светлая палитра (v1.2) ---------- */
html[data-theme-mode="light"] {
  color-scheme: light;
  --bg: #f4f6fd;
  --bg2: #e8ecf9;
  --panel: rgba(255, 255, 255, .82);
  --panel-solid: #ffffff;
  --glass: rgba(255, 255, 255, .74);
  --glass-hi: rgba(255, 255, 255, .95);
  --fill: rgba(24, 28, 66, .05);
  --fill-soft: rgba(24, 28, 66, .03);
  --fill-strong: rgba(24, 28, 66, .09);
  --stroke: rgba(24, 28, 66, .13);
  --divider: rgba(24, 28, 66, .10);
  --text: #161a30;
  --muted: #5d6384;
  --violet: #5b4bd6;
  --cyan: #126fae;
  --pink: #b72f94;
  --grad: linear-gradient(135deg, var(--violet), var(--cyan), var(--pink));
  --accent: var(--violet);
  --accent-soft: rgba(91, 75, 214, .12);
  --accent-text: #4635b8;
  --on-accent: #ffffff;
  --glow: rgba(91, 75, 214, .30);
  --glow-cyan: rgba(18, 111, 174, .25);
  --glow-pink: rgba(183, 47, 148, .22);
  --halo-a: rgba(91, 75, 214, .14);
  --halo-b: rgba(18, 111, 174, .10);
  --halo-c: rgba(183, 47, 148, .08);
  --tab-bg: rgba(255, 255, 255, .86);
  --backdrop: rgba(32, 36, 72, .34);
  --sheet-bg: linear-gradient(180deg, #ffffff, #f1f3fd);
  --modal-bg: rgba(255, 255, 255, .97);
  --toast-bg: rgba(255, 255, 255, .95);
  --field-bg: rgba(255, 255, 255, .86);
  --field-focus: #ffffff;
  --track: rgba(24, 28, 66, .12);
  --handle: rgba(24, 28, 66, .20);
  --placeholder: rgba(93, 99, 132, .78);
  --scroll-thumb: rgba(24, 28, 66, .22);
  --scroll-thumb-2: rgba(24, 28, 66, .18);
  --star-off: rgba(24, 28, 66, .18);
  --star-on: #d18a00;
  --toggle-knob: #ffffff;
  --shine: rgba(255, 255, 255, .65);
  --ripple: rgba(24, 28, 66, .14);
  --disc-1: #dfe3f5;
  --disc-2: #cbd1ea;
  --disc-3: #e7eafb;
  --success: #0f8258;
  --warning: #a56800;
  --danger: #c12c63;
  --boot-bg:
    radial-gradient(700px 460px at 30% 20%, rgba(91,75,214,.18), transparent 65%),
    radial-gradient(700px 460px at 75% 80%, rgba(183,47,148,.14), transparent 65%),
    linear-gradient(160deg, #fbfcff, #e9ecfa 60%);
  --boot-tagline: #5d6384;
  --boot-status: #6d7392;
  --boot-logo: #4635b8;
  --edge-shade: rgba(30, 34, 74, .12);
  --noise-opacity: .035;
  --noise-line: rgba(24, 28, 66, .30);
  --shadow: 0 18px 48px rgba(37, 43, 94, .16);
  --shadow-soft: 0 10px 30px rgba(37, 43, 94, .10);
}

/* акценты остаются рабочими и в светлом режиме */
html[data-theme-mode="light"][data-theme="aurora"] {
  --violet: #0d8f6a;
  --cyan: #0577a8;
  --pink: #a1258c;
  --accent-soft: rgba(13, 143, 106, .12);
  --accent-text: #0a7757;
  --glow: rgba(13, 143, 106, .28);
}
html[data-theme-mode="light"][data-theme="sunset"] {
  --violet: #c0431e;
  --cyan: #c81d5b;
  --pink: #9a6806;
  --accent-soft: rgba(192, 67, 30, .12);
  --accent-text: #a13a1b;
  --glow: rgba(192, 67, 30, .28);
}
[data-theme="aurora"] { --accent-soft: rgba(52,211,153,.14); --accent-text: #7ee7c2; --glow: rgba(52,211,153,.40); }
[data-theme="sunset"] { --accent-soft: rgba(255,154,107,.14); --accent-text: #ffb08a; --glow: rgba(255,154,107,.38); }

[data-theme="aurora"] {
  --violet: #6ee7b7;
  --cyan: #38bdf8;
  --pink: #a78bfa;
  --bg: #061014;
  --bg2: #0a1a22;
  --grad: linear-gradient(135deg, var(--violet), var(--cyan), var(--pink));
}

[data-theme="sunset"] {
  --violet: #ff9a6b;
  --cyan: #ff5e8a;
  --pink: #ffd166;
  --bg: #140810;
  --bg2: #1e0d18;
  --grad: linear-gradient(135deg, var(--violet), var(--cyan), var(--pink));
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overscroll-behavior: none;
}

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  position: relative;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  color: var(--text);
  background:
    radial-gradient(900px 520px at 12% -8%, var(--halo-a), transparent 62%),
    radial-gradient(760px 480px at 100% 4%, var(--halo-b), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, var(--halo-c), transparent 65%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

input, textarea, [contenteditable="true"], .selectable { user-select: text; -webkit-user-select: text; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--cyan); text-decoration: none; }
img, svg { display: block; max-width: 100%; }
::selection { background: var(--glow); color: var(--text); }

/* thin / hidden scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--violet), var(--cyan));
  border: 1px solid var(--stroke);
  border-radius: 99px;
  box-shadow: 0 0 8px var(--glow);
}
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--cyan), var(--pink)); }

/* ---------- shell ---------- */
#app { position: fixed; inset: 0; isolation: isolate; }

#screens {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--pad) + var(--safe-t)) var(--pad) calc(var(--tabh) + 96px + var(--safe-b));
  opacity: 0;
  transform: translateY(14px) scale(.995);
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}

.screen.active {
  display: block;
  opacity: 1;
  transform: none;
  animation: slideUp .35s var(--ease) both;
}

.screen > * { max-width: 560px; margin-left: auto; margin-right: auto; }

/* ---------- tab bar ---------- */
#tabbar {
  position: fixed;
  z-index: 40;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--tabh) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  background: var(--tab-bg);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border-top: 1px solid var(--stroke);
  box-shadow: 0 -12px 30px var(--edge-shade);
}

#tabbar > * {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 6px 2px 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .02em;
  text-align: center;
  transition: color .25s var(--ease), transform .2s var(--ease);
}

#tabbar > * svg, #tabbar > * .tab-icon, #tabbar > * i {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#tabbar > *.active,
#tabbar > *[aria-selected="true"],
#tabbar > *[data-active="true"] { color: var(--text); }

#tabbar > *.active::before,
#tabbar > *[aria-selected="true"]::before,
#tabbar > *[data-active="true"]::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 34px;
  height: 3px;
  border-radius: 0 0 99px 99px;
  background: var(--grad);
  transform: translateX(-50%);
  box-shadow: 0 0 14px rgba(139, 123, 255, .8);
  animation: pulse 2.4s ease-in-out infinite;
}

#tabbar > *.active svg,
#tabbar > *[aria-selected="true"] svg,
#tabbar > *[data-active="true"] svg {
  color: var(--violet);
  filter: drop-shadow(0 0 8px rgba(139, 123, 255, .6));
}

#tabbar > *:active { transform: scale(.93); }

/* ---------- mini player ---------- */
.mini {
  position: fixed;
  z-index: 35;
  left: 10px;
  right: 10px;
  bottom: calc(var(--tabh) + var(--safe-b) + 8px);
  min-height: 68px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px 10px 12px;
  overflow: hidden;
  border: 1px solid var(--stroke);
  border-radius: 18px;
  background: var(--panel);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: var(--shadow);
  cursor: pointer;
  animation: slideUp .32s var(--ease) both;
}

.mini::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 2px;
  background: linear-gradient(90deg, var(--violet), var(--cyan), var(--pink));
  transform-origin: left center;
  transform: scaleX(var(--mini-progress, 0));
  transition: transform .25s linear;
}

.mini::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(200px 80px at 0% 0%, rgba(139, 123, 255, .2), transparent 70%);
  pointer-events: none;
}

.mini > * { position: relative; z-index: 1; }
.mini.hidden, .hidden { display: none !important; }

.mini .mini-art, .mini .track-art, .mini .cover {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 12px;
  box-shadow: var(--shadow-soft);
}

.mini .mini-info, .mini .mini-meta { flex: 1; min-width: 0; }

.mini .mini-title, .mini .title {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini .mini-artist, .mini .subtitle {
  margin: 1px 0 0;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini .mini-actions, .mini .mini-controls { display: flex; align-items: center; gap: 2px; }

.mini .mini-play, .mini .mini-next, .mini .mini-prev {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--text);
  transition: transform .18s var(--ease), background .2s;
}
.mini .mini-play {
  background: var(--grad);
  color: var(--on-accent);
  box-shadow: 0 4px 18px var(--glow);
}
.mini .mini-play:active, .mini .mini-next:active { transform: scale(.88); }
.mini svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }

.mini .mini-progress, .mini .progress {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 2px;
  background: transparent;
  border-radius: 0;
}

/* ---------- overlays / sheets / toasts ---------- */
#overlay-root, #toast-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: var(--backdrop);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn .22s ease both;
}

.sheet {
  position: fixed;
  z-index: 1;
  left: 0; right: 0; bottom: 0;
  max-height: 86vh;
  overflow-y: auto;
  padding: 10px 16px calc(24px + var(--safe-b));
  border-radius: 26px 26px 0 0;
  border: 1px solid var(--stroke);
  border-bottom: 0;
  background: var(--sheet-bg);
  box-shadow: 0 -20px 60px var(--shadow);
  pointer-events: auto;
  animation: slideUp .34s var(--ease) both;
}

.sheet::before {
  content: "";
  display: block;
  width: 42px;
  height: 4px;
  margin: 2px auto 16px;
  border-radius: 99px;
  background: var(--handle);
}

.sheet .sheet-title { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
#overlay-root .sheet + .backdrop, #overlay-root .backdrop { pointer-events: auto; }

.modal {
  position: fixed;
  z-index: 1;
  left: 50%; top: 50%;
  width: min(420px, calc(100% - 32px));
  max-height: 80vh;
  overflow-y: auto;
  transform: translate(-50%, -50%);
  padding: 20px;
  border-radius: var(--radius);
  border: 1px solid var(--stroke);
  background: var(--modal-bg);
  box-shadow: var(--shadow);
  pointer-events: auto;
  animation: fadeIn .25s ease both;
}

#toast-root {
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 0 16px calc(var(--tabh) + 92px + var(--safe-b));
}

.toast {
  max-width: 100%;
  padding: 11px 16px;
  border-radius: 14px;
  border: 1px solid var(--stroke);
  background: var(--toast-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
  color: var(--text);
  font-size: 13px;
  text-align: center;
  pointer-events: auto;
  animation: toastIn .3s var(--ease) both;
}

.toast.error { border-color: rgba(255, 106, 213, .5); }
.toast.success { border-color: rgba(110, 231, 183, .5); }

/* ---------- boot ---------- */
#boot {
  position: fixed;
  z-index: 999;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  padding: 24px;
  background: var(--boot-bg);
  transition: opacity .55s ease, visibility .55s;
}

#boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }

/* --- startup show: dražimo ga vidljivim i ako JS zamrije ----------------- */
@keyframes bootAutoHide {
  0%, 92% { opacity: 1; visibility: visible; }
  100%    { opacity: 0; visibility: hidden; }
}
#boot { animation: bootAutoHide 5.5s ease-in-out forwards; }
#boot.gone { animation: none; }
html.no-splash #boot { display: none !important; animation: none; }

.boot-rings {
  position: relative;
  width: 132px;
  height: 132px;
  display: grid;
  place-items: center;
}
.boot-rings i {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--violet);
  border-right-color: rgba(79,179,255,.6);
  box-shadow: 0 0 22px var(--glow), inset 0 0 18px var(--glow-cyan);
  animation: bootSpin 2.4s linear infinite;
}
.boot-rings i:nth-child(2) {
  inset: 14px;
  border-top-color: var(--cyan);
  border-right-color: transparent;
  border-bottom-color: rgba(255,106,213,.7);
  animation-duration: 1.7s;
  animation-direction: reverse;
}
.boot-rings i:nth-child(3) {
  inset: 28px;
  border-top-color: var(--pink);
  border-right-color: transparent;
  border-left-color: rgba(139,123,255,.65);
  animation-duration: 1.15s;
}
.boot-rings b {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--grad);
  background-size: 220% 220%;
  box-shadow: 0 0 34px var(--glow);
  animation: bootCore 1.8s ease-in-out infinite, shimmer 3s linear infinite;
}
@keyframes bootSpin { to { transform: rotate(360deg); } }
@keyframes bootCore {
  0%,100% { transform: scale(.9) rotate(-8deg); }
  50%     { transform: scale(1.12) rotate(8deg); }
}

.boot-tagline {
  margin-top: -14px;
  color: var(--boot-tagline);
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: lowercase;
  animation: fadeIn .8s .25s both;
}
.boot-eq {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 30px;
  margin-top: -8px;
}
.boot-eq i {
  width: 4px;
  height: 9px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--pink), var(--cyan));
  box-shadow: 0 0 10px rgba(139,123,255,.5);
  animation: bootBar .9s ease-in-out infinite alternate;
}
.boot-eq i:nth-child(2) { animation-delay: .11s; }
.boot-eq i:nth-child(3) { animation-delay: .22s; }
.boot-eq i:nth-child(4) { animation-delay: .33s; }
.boot-eq i:nth-child(5) { animation-delay: .44s; }
.boot-eq i:nth-child(6) { animation-delay: .31s; }
.boot-eq i:nth-child(7) { animation-delay: .18s; }
.boot-eq i:nth-child(8) { animation-delay: .07s; }
.boot-eq i:nth-child(9) { animation-delay: .4s; }
@keyframes bootBar { from { height: 6px; } to { height: 29px; } }
.boot-status { color: var(--boot-status); font-size: 11px; letter-spacing: .05em; }

/* WebView на некоторых прошивках не рисует gradient-clip text — страховка */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .boot-logo { color: var(--boot-logo); background: none; -webkit-text-fill-color: var(--boot-logo); }
}

/* Режим «без тяжёлых эффектов» — включается сторожем, если WebView чёрный */
html.safe-render .screen.active { display: block !important; opacity: 1 !important; transform: none !important; }
html.safe-render *, html.safe-render *::before, html.safe-render *::after {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  filter: none !important;
  mix-blend-mode: normal !important;
  animation: none !important;
  transition: none !important;
}
html.safe-render .boot-logo {
  color: var(--boot-logo) !important;
  background: none !important;
  -webkit-text-fill-color: var(--boot-logo) !important;
}

.boot-logo {
  position: relative;
  padding-left: 46px;
  font-size: clamp(26px, 8vw, 40px);
  font-weight: 900;
  letter-spacing: .16em;
  background: var(--grad);
  background-size: 220% 220%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: glow 3s ease-in-out infinite, float 3.6s ease-in-out infinite;
}

.boot-logo::before {
  content: "♪";
  position: absolute;
  left: 0; top: 50%;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--grad);
  color: var(--on-accent);
  font-size: 24px;
  letter-spacing: 0;
  -webkit-text-fill-color: var(--on-accent);
  transform: translateY(-50%);
  box-shadow: 0 0 26px var(--glow);
  animation: heartbeat 1.8s ease-in-out infinite;
}

.boot-bar {
  position: relative;
  width: min(240px, 70vw);
  height: 4px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--track);
}

.boot-bar i {
  position: absolute;
  inset: 0;
  width: 45%;
  border-radius: inherit;
  background: var(--grad);
  box-shadow: 0 0 16px var(--glow);
  animation: bootSlide 1.25s ease-in-out infinite;
}

@keyframes bootSlide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(240%); }
}

/* ---------- typography ---------- */
.title {
  margin: 0;
  font-size: clamp(21px, 6vw, 28px);
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: -.02em;
}

.subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.muted { color: var(--muted) !important; }

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 2px 10px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.section-title:first-child { margin-top: 6px; }
.section-title small, .section-title .more { color: var(--muted); font-size: 12px; font-weight: 600; }

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 2px 0 16px;
}

.gradient-text {
  background: var(--grad);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shimmerText 6s ease infinite;
}

.neon {
  color: var(--text);
  text-shadow: 0 0 6px var(--violet), 0 0 18px rgba(139,123,255,.6), 0 0 34px rgba(79,179,255,.35);
}

/* ---------- surfaces ---------- */
.card, .glass {
  position: relative;
  padding: 14px;
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-hi);
}

.card + .card, .glass + .card { margin-top: 10px; }
.card:active { transform: scale(.995); }

.card.accent::before, .glass.accent::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 2px;
  border-radius: var(--radius) var(--radius) 0 0;
  background: var(--grad);
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.row.grow > *:last-child { margin-left: auto; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.grid.one { grid-template-columns: 1fr; }

.divider, .sep { height: 1px; margin: 14px 0; border: 0; background: var(--stroke); }
.spacer { flex: 1; }
.center { text-align: center; }

/* ---------- chips / badges / buttons ---------- */
.chip, .pill, .badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 30px;
  padding: 5px 11px;
  border-radius: 99px;
  border: 1px solid var(--stroke);
  background: var(--glass);
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
  transition: color .2s, border-color .2s, background .2s, transform .15s var(--ease);
}

.chip:active, .pill:active { transform: scale(.94); }
.chip.active, .chip.selected, .pill.active, .pill.selected {
  color: var(--on-accent);
  border-color: transparent;
  background: var(--grad);
  box-shadow: 0 4px 16px var(--glow);
}

.badge { min-height: 22px; padding: 2px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.badge.hot { color: var(--on-accent); background: linear-gradient(135deg, var(--pink), var(--violet)); border-color: transparent; }

.btn, .icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 14px;
  border: 1px solid var(--stroke);
  background: var(--glass);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  transition: transform .16s var(--ease), filter .2s, background .2s, box-shadow .2s;
}

.btn:active, .icon-btn:active { transform: scale(.95); }
.btn:hover { background: var(--fill-strong); }
.btn:disabled { opacity: .45; pointer-events: none; }

.btn.primary {
  border-color: transparent;
  background: var(--grad);
  background-size: 160% 160%;
  color: var(--on-accent);
  box-shadow: 0 8px 24px var(--glow);
  animation: shimmerText 8s ease infinite;
}
.btn.primary:active { box-shadow: 0 2px 10px rgba(139,123,255,.5); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 12px; border-radius: 11px; }

.icon-btn {
  width: 44px;
  height: 44px;
  padding: 0;
  flex: none;
  border-radius: 50%;
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.active { color: var(--accent); background: var(--accent-soft); border-color: var(--glow); }
.icon-btn.like.active { color: var(--pink); background: var(--accent-soft); border-color: var(--glow-pink); }
.icon-btn.lg { width: 56px; height: 56px; }
.icon-btn.lg svg { width: 26px; height: 26px; }

.btn-play {
  width: 72px; height: 72px;
  display: grid; place-items: center;
  flex: none;
  border-radius: 50%;
  background: var(--grad);
  color: var(--on-accent);
  box-shadow: 0 10px 32px var(--glow);
  animation: pulse 2.8s ease-in-out infinite;
}
.btn-play svg { width: 30px; height: 30px; fill: currentColor; }
.btn-play:active { transform: scale(.93); }

/* ---------- artwork ---------- */
.track-art, .cover {
  position: relative;
  flex: none;
  aspect-ratio: 1 / 1;
  width: 48px;
  border-radius: 13px;
  overflow: hidden;
  background: var(--grad);
  box-shadow: var(--shadow-soft);
}
.cover { width: 100%; border-radius: 18px; aspect-ratio: 1 / 1; }
.cover.lg, .track-art.lg { border-radius: 24px; }
.cover.sm, .track-art.sm { width: 36px; border-radius: 10px; }

.track-art::after, .cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.35), transparent 45%),
    linear-gradient(150deg, transparent 45%, rgba(0,0,0,.3));
  mix-blend-mode: screen;
  pointer-events: none;
}

.track-art span, .cover span {
  position: absolute;
  inset: auto 0 0 0;
  z-index: 1;
  padding: 4px;
  font-size: 9px;
  font-weight: 800;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,.6);
}

/* ---------- track list ---------- */
.track-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 16px;
  border: 1px solid transparent;
  text-align: left;
  transition: background .2s, border-color .2s, transform .15s var(--ease);
  animation: fadeIn .3s ease both;
}
.track-row:hover { background: var(--glass); }
.track-row:active { transform: scale(.985); background: var(--fill-strong); }
.track-row.playing, .track-row.active {
  border-color: rgba(139,123,255,.35);
  background: linear-gradient(90deg, rgba(139,123,255,.18), rgba(79,179,255,.06));
}

.track-row .tr-info { flex: 1; min-width: 0; }
.track-row .tr-title, .track-row .title {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-row .tr-sub, .track-row .subtitle {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-row .tr-time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.track-row .icon-btn { width: 36px; height: 36px; }

/* ---------- progress / equalizer / disc / marquee ---------- */
.progress {
  position: relative;
  width: 100%;
  height: 5px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--track);
  cursor: pointer;
}
.progress > i {
  display: block;
  width: var(--p, 0%);
  height: 100%;
  border-radius: inherit;
  background: var(--grad);
  box-shadow: 0 0 12px rgba(139,123,255,.65);
  transition: width .2s linear;
}
.progress::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--ripple), transparent);
  transform: translateX(-100%);
  animation: shimmer 2.6s ease-in-out infinite;
  pointer-events: none;
}

.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.eq i {
  display: block;
  width: 3px;
  height: 40%;
  border-radius: 2px;
  background: currentColor;
  color: var(--violet);
  transform-origin: bottom;
  animation: eq1 .9s ease-in-out infinite alternate;
}
.eq i:nth-child(1) { animation-name: eq1; }
.eq i:nth-child(2) { animation-name: eq2; }
.eq i:nth-child(3) { animation-name: eq3; }
.eq i:nth-child(4) { animation-name: eq4; }
.eq i:nth-child(5) { animation-name: eq5; }
.eq.paused i { animation-play-state: paused; height: 25%; }

.disc {
  position: relative;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  margin: 10px auto;
  background:
    radial-gradient(circle at center, var(--violet) 0 16%, transparent 16.5%),
    radial-gradient(circle at center, var(--disc-1) 0 33%, transparent 33.5%),
    repeating-radial-gradient(circle at center, var(--disc-2) 0 3px, var(--disc-3) 3px 6px);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--stroke);
  animation: spin 9s linear infinite;
}
.disc::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 70%, var(--shine) 82%, transparent 92%);
}
.disc::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--bg);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 3px var(--stroke);
}
.disc.paused { animation-play-state: paused; }

.marquee {
  display: block;
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.marquee > span, .marquee.scroll > span {
  display: inline-block;
  padding-right: 32px;
  animation: marquee 12s linear infinite;
}

/* ---------- forms ---------- */
.field {
  display: block;
  width: 100%;
  min-height: 46px;
  margin: 6px 0 14px;
  padding: 11px 13px;
  border: 1px solid var(--stroke);
  border-radius: 14px;
  outline: none;
  background: var(--field-bg);
  color: var(--text);
  font-size: 14px;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field::placeholder { color: var(--placeholder); }
.field:focus {
  border-color: var(--glow);
  background: var(--field-focus);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea.field { min-height: 100px; resize: vertical; }
.field-label { display: block; margin: 12px 2px 0; color: var(--muted); font-size: 12px; font-weight: 700; }

.search {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-height: 46px;
  padding: 0 14px;
  border: 1px solid var(--stroke);
  border-radius: 15px;
  background: var(--field-bg);
  transition: border-color .2s, box-shadow .2s;
}
.search:focus-within { border-color: var(--glow); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { width: 19px; height: 19px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; }
.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
}
.search input::placeholder { color: var(--placeholder); }

.rating { display: inline-flex; gap: 3px; align-items: center; }
.rating .star {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  color: var(--star-off);
  font-size: 21px;
  transition: transform .15s var(--ease), color .2s;
}
.rating .star:active { transform: scale(1.2); }
.rating .star.on, .rating .star.active { color: var(--star-on); text-shadow: 0 0 12px var(--glow); }

.swatch {
  width: 34px;
  height: 34px;
  flex: none;
  border: 2px solid transparent;
  border-radius: 50%;
  background: var(--grad);
  box-shadow: 0 3px 10px rgba(0,0,0,.35);
  transition: transform .16s var(--ease), box-shadow .2s;
}
.swatch:active { transform: scale(.88); }
.swatch.active, .swatch.selected {
  border-color: var(--text);
  box-shadow: 0 0 0 3px var(--stroke), 0 0 16px var(--glow);
}

.toggle {
  position: relative;
  width: 46px;
  height: 27px;
  flex: none;
  border-radius: 99px;
  background: var(--track);
  transition: background .25s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 21px; height: 21px;
  border-radius: 50%;
  background: var(--toggle-knob);
  box-shadow: 0 2px 6px var(--edge-shade);
  transition: transform .25s var(--ease);
}
.toggle.on, .toggle.active { background: var(--grad); }
.toggle.on::after, .toggle.active::after { transform: translateX(19px); }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 5px;
  border-radius: 99px;
  background: var(--track);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 12px var(--glow);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px;
  border: 0; border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 12px var(--glow);
  cursor: pointer;
}

/* ---------- states ---------- */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 180px;
  padding: 26px 18px;
  color: var(--muted);
  text-align: center;
  border: 1px dashed var(--stroke);
  border-radius: var(--radius);
  background: var(--fill-soft);
}
.empty .empty-icon { font-size: 34px; opacity: .8; animation: float 3s ease-in-out infinite; }
.empty strong { color: var(--text); font-size: 15px; }

.fade-in { animation: fadeIn .45s ease both; }
.shimmer {
  position: relative;
  overflow: hidden;
  background: var(--fill);
}
.shimmer::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--shine), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.4s infinite;
}

.ripple {
  position: relative;
  overflow: hidden;
}
.ripple::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--ripple);
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  pointer-events: none;
}
.ripple:active::after { animation: ripple .55s ease-out; }

.vis-bar {
  display: inline-block;
  width: 3px;
  min-height: 4px;
  border-radius: 2px;
  background: var(--grad);
  animation: wave 1.1s ease-in-out infinite alternate;
}

/* ---------- keyframes ---------- */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .78; transform: scale(1.035); }
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
@keyframes shimmerText {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes ripple {
  0% { transform: translate(-50%, -50%) scale(0); opacity: .65; }
  100% { transform: translate(-50%, -50%) scale(22); opacity: 0; }
}
@keyframes eq1 { 0% { height: 20%; } 100% { height: 90%; } }
@keyframes eq2 { 0% { height: 70%; } 100% { height: 30%; } }
@keyframes eq3 { 0% { height: 35%; } 100% { height: 100%; } }
@keyframes eq4 { 0% { height: 85%; } 100% { height: 25%; } }
@keyframes eq5 { 0% { height: 45%; } 100% { height: 80%; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(16px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes marquee {
  0%, 12% { transform: translateX(0); }
  88%, 100% { transform: translateX(-100%); }
}
@keyframes glow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(139,123,255,.35)); }
  50% { filter: drop-shadow(0 0 22px rgba(139,123,255,.85)); }
}
@keyframes heartbeat {
  0%, 100% { transform: translateY(-50%) scale(1); }
  15% { transform: translateY(-50%) scale(1.12); }
  30% { transform: translateY(-50%) scale(1); }
  45% { transform: translateY(-50%) scale(1.08); }
}
@keyframes wave {
  0% { transform: scaleY(.35); }
  100% { transform: scaleY(1); }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
  animation-duration: .001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .001ms !important;
}
html.reduce-motion .disc, html.reduce-motion .eq i, html.reduce-motion .marquee > span { animation: none !important; }

/* ---------- responsive ---------- */
@media (max-width: 360px) {
  :root { --pad: 11px; --radius: 18px; --tabh: 62px; }
  body { font-size: 14px; }
  .screen { padding-left: var(--pad); padding-right: var(--pad); }
  .card, .glass { padding: 11px; }
  .track-row { gap: 9px; padding: 7px; }
  .icon-btn { width: 40px; height: 40px; }
  .disc { width: 150px; height: 150px; }
  #tabbar > * { font-size: 9px; }
}

@media (min-width: 600px) {
  #screens::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, var(--edge-shade), transparent 18%, transparent 82%, var(--edge-shade));
    z-index: 2;
  }
  .screen {
    left: 50%;
    right: auto;
    width: min(560px, 100%);
    transform: translateX(-50%) translateY(14px);
    border-left: 1px solid var(--stroke);
    border-right: 1px solid var(--stroke);
    box-shadow: 0 0 70px var(--shadow);
  }
  .screen.active { transform: translateX(-50%); animation: none; }
  .mini { left: 50%; right: auto; width: min(540px, calc(100% - 20px)); transform: translateX(-50%); animation: none; }
  #tabbar { left: 50%; right: auto; width: min(560px, 100%); transform: translateX(-50%); border-radius: 20px 20px 0 0; }
  .sheet { left: 50%; right: auto; width: min(560px, 100%); transform: translateX(-50%); animation: none; }
  #toast-root { left: 50%; right: auto; width: min(560px, 100%); transform: translateX(-50%); }
}

/* ---------- settings screen (v1.1) ---------- */
.set-head { margin-bottom: 18px; }
.set-head .title {
  margin: 0;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -.02em;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.set-head .subtitle { margin: 4px 0 0; }
html.safe-render .set-head .title { color: var(--boot-logo) !important; background: none !important; -webkit-text-fill-color: var(--boot-logo) !important; }
.set-card { padding: 8px 14px 14px; margin-bottom: 14px; }
.set-card .section-title { margin: 12px 0 8px; }
.set-row {
  width: 100%;
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 2px;
  border: 0;
  border-bottom: 1px solid var(--divider);
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.set-row:last-child { border-bottom: 0; }
.set-row.static { cursor: default; }
.set-ico {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--accent-soft);
  color: var(--accent-text);
}
.set-ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; }
.set-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.set-text b { font-size: 13px; font-weight: 700; }
.set-text small { color: var(--muted); font-size: 11px; line-height: 1.35; }
.set-switch {
  width: 44px;
  height: 26px;
  flex: none;
  border-radius: 99px;
  background: var(--track);
  padding: 3px;
  transition: background .25s var(--ease);
}
.set-switch i {
  display: block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--toggle-knob);
  box-shadow: 0 2px 8px var(--edge-shade);
  transition: transform .25s var(--ease);
}
.set-switch.on { background: linear-gradient(135deg, var(--violet), var(--cyan)); }
.set-switch.on i { transform: translateX(18px); background: var(--toggle-knob); }
.set-val { color: var(--muted); font-size: 12px; font-weight: 700; }
.set-themes { display: flex; gap: 9px; padding: 4px 0 2px; }
.theme-btn {
  flex: 1;
  min-width: 0;
  padding: 8px 6px 10px;
  border-radius: 15px;
  border: 1px solid var(--stroke);
  background: var(--fill-soft);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}
.theme-btn.selected { color: var(--text); border-color: var(--glow); background: var(--accent-soft); }
.theme-preview { width: 100%; height: 30px; border-radius: 9px; display: block; }
.set-foot { text-align: center; font-size: 11px; padding: 6px 0 20px; }
.tab-settings { color: var(--muted); }

/* ============================================================
   THE MUSIC v1.2 — UI polish, theme modes, module registry
   Всё добавлено поверх v1.1. html.safe-render остаётся приоритетным.
   ============================================================ */

/* --- шум через CSS-градиенты (без картинок и внешних файлов) --- */
html::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  opacity: var(--noise-opacity);
  background-image:
    repeating-linear-gradient(0deg, var(--noise-line) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--noise-line) 0 1px, transparent 1px 4px);
  background-size: 3px 3px, 4px 4px;
  mix-blend-mode: soft-light;
}
html.safe-render::after { display: none !important; }

/* --- плавная смена палитры (класс ставит theme.js на ~420 мс) --- */
html.theme-transition,
html.theme-transition *,
html.theme-transition *::before,
html.theme-transition *::after {
  transition:
    color var(--theme-ms) var(--ease),
    background-color var(--theme-ms) var(--ease),
    border-color var(--theme-ms) var(--ease),
    box-shadow var(--theme-ms) var(--ease),
    fill var(--theme-ms) var(--ease),
    stroke var(--theme-ms) var(--ease) !important;
}

/* --- мягкие glow-акценты и «стекло» --- */
.glow { box-shadow: 0 0 26px var(--glow) !important; }
.glow-sm { box-shadow: 0 0 12px var(--glow) !important; }
.card, .glass {
  box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-hi);
}
.card::after, .glass::after { pointer-events: none; }

/* анимированный градиентный бордер на активных нейтральных элементах */
@keyframes borderFlow {
  0%   { background-position: 0 0, 0% 50%; }
  100% { background-position: 0 0, 200% 50%; }
}
@keyframes indicatorPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 12px var(--glow); }
  50%      { opacity: .72; box-shadow: 0 0 22px var(--glow); }
}
@supports (background-clip: border-box) {
  .card.active, .card.selected, .set-card.active,
  .theme-btn.selected, .auto-pl-card.active, .plays-row.active,
  .discover-item.active, .avatar-opt.active, .avatar-opt.selected,
  .i18n-option.active, .i18n-btn.selected,
  .theme-mode-opt.active, .theme-mode-btn.selected, .theme-mode-item.active {
    border-color: transparent;
    background: var(--panel) padding-box, var(--grad) border-box;
    background-size: 100% 100%, 200% 200%;
    box-shadow: var(--shadow-soft), 0 0 16px var(--glow);
    animation: borderFlow 3.6s linear infinite;
  }
}

/* --- таббар: активный индикатор и мягкая подсветка иконки --- */
#tabbar::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 1px;
  background: var(--grad);
  opacity: .4;
  pointer-events: none;
}
#tabbar > *.active::before,
#tabbar > *[aria-selected="true"]::before,
#tabbar > *[data-active="true"]::before {
  background-size: 200% 100%;
  animation: borderFlow 3s linear infinite, indicatorPulse 2.4s ease-in-out infinite;
}
.tab-item .tab-ico {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  transition: background .22s var(--ease), transform .18s var(--ease);
}
.tab-item .tab-label { line-height: 1.1; }
.tab-item.active .tab-ico,
.tab-item[aria-selected="true"] .tab-ico {
  background: var(--accent-soft);
  transform: translateY(-1px);
}
.tab-item.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 5px;
  width: 26px;
  height: 20px;
  border-radius: 50%;
  background: var(--glow);
  filter: blur(9px);
  transform: translateX(-50%);
  pointer-events: none;
}

/* --- hover / tap反馈 без перегруза --- */
@media (hover: hover) {
  .card:hover, .glass:hover, .auto-pl-card:hover, .plays-row:hover,
  .auto-pl-track:hover, .note-sheet:hover { transform: translateY(-2px); }
  .btn:hover, .publish-btn:hover, .google-btn:hover,
  .i18n-btn:hover, .theme-mode-btn:hover, .swipe-action:hover { transform: translateY(-1px); }
}
.tab-item:active, .swipe-action:active, .avatar-opt:active,
.publish-btn:active, .google-btn:active { transform: scale(.94); }

/* --- лёгкие правки светлой темы там, где в v1.1 были жёсткие rgba --- */
html[data-theme-mode="light"] .track-row.playing,
html[data-theme-mode="light"] .track-row.active {
  border-color: var(--stroke);
  background: linear-gradient(90deg, var(--accent-soft), var(--fill-soft));
}
html[data-theme-mode="light"] .mini::after {
  background: radial-gradient(200px 80px at 0% 0%, var(--halo-a), transparent 70%);
}
html[data-theme-mode="light"] .btn.primary:active { box-shadow: 0 2px 10px var(--glow); }
html[data-theme-mode="light"] .track-art::after,
html[data-theme-mode="light"] .cover::after {
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.5), transparent 45%),
    linear-gradient(150deg, transparent 45%, rgba(24,28,66,.12));
  mix-blend-mode: normal;
}

/* ============================================================
   РЕЕСТР КЛАССОВ v1.2 (§7.1). Стили работают независимо от того,
   вставил ли модуль элемент сейчас или появится позже.
   ============================================================ */

/* --- i18n-* --- */
[class^="i18n-"], [class*=" i18n-"] { -webkit-tap-highlight-color: transparent; }
.i18n-row, .i18n-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.i18n-group { flex-wrap: wrap; }
.i18n-label, .i18n-title { color: var(--muted); font-size: 12px; font-weight: 700; }
.i18n-picker, .i18n-options, .i18n-list {
  display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px;
}
.i18n-btn, .i18n-option, .i18n-item {
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid var(--stroke);
  border-radius: 12px;
  background: var(--glass);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  transition: transform .16s var(--ease), background .2s, border-color .2s, box-shadow .2s;
}
.i18n-btn.active, .i18n-btn.selected, .i18n-option.active,
.i18n-option.selected, .i18n-item.active {
  color: var(--text);
  border-color: var(--glow);
  background: var(--accent-soft);
  box-shadow: 0 0 16px var(--glow);
}
.i18n-select {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 6px 0 12px;
  padding: 10px 12px;
  border: 1px solid var(--stroke);
  border-radius: 14px;
  outline: none;
  background: var(--field-bg);
  color: var(--text);
  font-size: 14px;
}
.i18n-select:focus { border-color: var(--glow); box-shadow: 0 0 0 3px var(--accent-soft); }
.i18n-flag { font-size: 18px; line-height: 1; }

/* --- theme-mode-* --- */
.theme-mode-picker, .theme-mode-options, .theme-mode-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
}
.theme-mode-btn, .theme-mode-opt, .theme-mode-item {
  flex: 1 1 90px;
  min-width: 90px;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 8px;
  border: 1px solid var(--stroke);
  border-radius: 16px;
  background: var(--fill-soft);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  transition: transform .16s var(--ease), border-color .2s, background .2s, box-shadow .2s;
}
.theme-mode-btn.active, .theme-mode-btn.selected,
.theme-mode-opt.active, .theme-mode-opt.selected,
.theme-mode-item.active, .theme-mode-item.selected {
  color: var(--text);
  border-color: var(--glow);
  background: var(--accent-soft);
  box-shadow: 0 0 16px var(--glow);
}
.theme-mode-icon { font-size: 20px; line-height: 1; }
.theme-mode-label { color: inherit; font-size: 12px; font-weight: 700; }
.theme-mode-preview {
  display: block;
  width: 100%;
  height: 26px;
  border-radius: 8px;
  background: var(--grad);
  box-shadow: 0 3px 12px var(--glow);
}
.theme-mode-badge {
  min-height: 18px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: 10px;
  font-weight: 800;
}
html[data-theme-mode="light"] .theme-mode-preview[data-mode="light"],
html[data-theme-mode="dark"] .theme-mode-preview[data-mode="dark"] {
  box-shadow: 0 0 0 2px var(--text), 0 3px 12px var(--glow);
}

/* --- заметки --- */
.note-sheet {
  position: fixed;
  z-index: 1;
  left: 0; right: 0; bottom: 0;
  max-height: 86vh;
  overflow-y: auto;
  padding: 12px 16px calc(20px + var(--safe-b));
  border: 1px solid var(--stroke);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  background: var(--sheet-bg);
  box-shadow: 0 -20px 60px var(--shadow);
  color: var(--text);
  pointer-events: auto;
  animation: slideUp .34s var(--ease) both;
}
.note-sheet::before {
  content: "";
  display: block;
  width: 42px; height: 4px;
  margin: 0 auto 14px;
  border-radius: 99px;
  background: var(--handle);
}
.note-area {
  display: block;
  width: 100%;
  min-height: 140px;
  margin: 6px 0 12px;
  padding: 12px 13px;
  border: 1px solid var(--stroke);
  border-radius: 16px;
  outline: none;
  background: var(--field-bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  resize: vertical;
}
.note-area::placeholder { color: var(--placeholder); }
.note-area:focus { border-color: var(--glow); box-shadow: 0 0 0 3px var(--accent-soft); }
.note-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.note-actions > * { flex: 0 1 auto; }

/* --- аватары и PNG-иконки --- */
/* .avatar-picker — это весь оверлей пикера (avatar.js), а не сетка опций */
.avatar-picker {
  position: fixed;
  z-index: 120;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  pointer-events: auto;
}
.avatar-picker-backdrop {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: auto;
  background: var(--backdrop);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn .2s ease both;
}
.avatar-sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 14px 16px calc(20px + var(--safe-b));
  border: 1px solid var(--stroke);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  background: var(--sheet-bg);
  box-shadow: 0 -20px 60px var(--shadow);
  color: var(--text);
  pointer-events: auto;
  animation: slideUp .34s var(--ease) both;
}
.avatar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: 10px;
  max-height: 46vh;
  overflow-y: auto;
  padding: 4px;
}
.avatar-opt {
  position: relative;
  aspect-ratio: 1 / 1;
  min-width: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--stroke);
  border-radius: 18px;
  background: var(--fill);
  color: var(--text);
  font-size: 22px;
  transition: transform .16s var(--ease), border-color .2s, box-shadow .2s;
}
.avatar-opt img, .avatar-opt svg { width: 100%; height: 100%; object-fit: cover; }
.track-avatar {
  width: 40px; height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: var(--grad);
  color: var(--on-accent);
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 0 0 2px var(--stroke), 0 4px 12px var(--shadow-soft);
}
.track-avatar img { width: 100%; height: 100%; object-fit: cover; }
.png-ico {
  display: inline-block;
  width: 20px; height: 20px;
  flex: none;
  object-fit: contain;
  vertical-align: middle;
}
.png-ico.sm { width: 16px; height: 16px; }
.png-ico.lg { width: 28px; height: 28px; }

/* --- авто-плейлисты --- */
.auto-pl-section, .plays-section { margin: 18px 0 10px; }
.auto-pl-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  margin: 8px 0;
  padding: 12px;
  border: 1px solid var(--stroke);
  border-radius: 18px;
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: var(--shadow-soft);
  color: var(--text);
  text-align: left;
  transition: transform .18s var(--ease), border-color .2s, box-shadow .2s;
}
.auto-pl-card > .auto-pl-icon, .auto-pl-card > .set-ico {
  width: 38px; height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent-text);
}
.auto-pl-card .auto-pl-meta { flex: 1; min-width: 0; }
.auto-pl-card b { display: block; font-size: 14px; }
.auto-pl-card small { color: var(--muted); font-size: 11px; }
.auto-pl-track {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 6px 8px;
  border-radius: 12px;
  color: var(--text);
  text-align: left;
  transition: background .2s, transform .16s var(--ease);
}
.auto-pl-track:hover { background: var(--fill); }
.auto-pl-track:active { transform: scale(.985); }

/* --- счётчики прослушиваний --- */
.plays-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  padding: 2px 8px;
  border: 1px solid var(--stroke);
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: 10px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.plays-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 7px 10px;
  border-radius: 12px;
  color: var(--text);
  transition: background .2s, transform .16s var(--ease);
}
.plays-row:hover { background: var(--fill); }
.plays-row .plays-num { color: var(--accent-text); font-weight: 800; font-variant-numeric: tabular-nums; }

/* --- жесты и свайп-действия --- */
.track-row { position: relative; }
.gesture-hint {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(var(--tabh) + var(--safe-b) + 92px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  border: 1px solid var(--stroke);
  border-radius: 99px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  pointer-events: none;
  animation: hintFloat 2.8s ease-in-out infinite;
}
@keyframes hintFloat {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-5px); }
}
.swipe-actions {
  position: absolute;
  z-index: 2;
  top: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px;
  background: linear-gradient(90deg, transparent, var(--panel));
  opacity: 0;
  transform: translateX(12px);
  pointer-events: none;
  transition: opacity .2s var(--ease), transform .2s var(--ease);
}
.track-row.swiped .swipe-actions, .swipe-actions.open { opacity: 1; transform: none; pointer-events: auto; }
.swipe-action {
  width: 44px; height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--stroke);
  border-radius: 14px;
  background: var(--glass);
  color: var(--text);
  box-shadow: var(--shadow-soft);
  transition: transform .16s var(--ease), background .2s;
}
.swipe-action svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; }
.swipe-action.like { color: var(--pink); }
.swipe-action.add { color: var(--cyan); }
.swipe-action.delete, .swipe-action.remove { color: var(--danger); }

/* --- discover / publish / stats --- */
.discover-bar {
  position: sticky;
  z-index: 5;
  top: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 12px;
  padding: 8px 0;
  background: linear-gradient(180deg, var(--bg) 72%, transparent);
}
.discover-bar .search { margin: 0; }
.discover-results { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.discover-results > * { min-width: 0; }
.publish-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 13px;
  background: var(--grad);
  background-size: 160% 160%;
  color: var(--on-accent);
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 8px 22px var(--glow);
  animation: shimmerText 8s ease infinite;
  transition: transform .16s var(--ease), box-shadow .2s;
}
.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  padding: 3px 9px;
  border: 1px solid var(--stroke);
  border-radius: 99px;
  background: var(--glass);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stat-chip b, .stat-chip strong { color: var(--text); }
.stat-row { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 8px 0; }

/* --- аккаунт / авторизация / синхронизация --- */
.account-sheet, .auth-sheet {
  position: fixed;
  z-index: 1;
  left: 0; right: 0; bottom: 0;
  max-height: 88vh;
  overflow-y: auto;
  padding: 12px 16px calc(24px + var(--safe-b));
  border: 1px solid var(--stroke);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  background: var(--sheet-bg);
  box-shadow: 0 -20px 60px var(--shadow);
  color: var(--text);
  pointer-events: auto;

/* --- реальное отключение движения (усиление v1.1) --- */
@media (prefers-reduced-motion: reduce) {
  html, html *, html *::before, html *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  html #boot { animation: bootAutoHide .001ms linear forwards !important; }
}
html.reduce-motion,
html.reduce-motion *,
html.reduce-motion *::before,
html.reduce-motion *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}
/* boot должен исчезнуть и при отключённой анимации, иначе экран останется чёрным */
html.reduce-motion #boot { animation: bootAutoHide .001ms linear forwards !important; }

    var core = tm && tm.Core;

      try { return core.icon(name); } catch (e) {}

    init: function () {

  }

  function openSheet() {
    var c = core();
    if (!c || typeof document === 'undefined' || !document.createElement) return;
    closeSheet();

    var acc = getState().account || {};
    var root = document.getElementById('overlay-root') || document.body;
    if (!root) return;

    var wrap = document.createElement('div');
    wrap.className = 'auth-overlay';
    wrap.innerHTML =
      '<div class="sheet auth-sheet" role="dialog" aria-modal="true" aria-label="Вход в The Music">' +
        '<button type="button" class="sheet-close" data-auth-close="1" aria-label="Закрыть">' +
          (icon('close') || '×') + '</button>' +
        '<h2 class="sheet-title">Аккаунт The Music</h2>' +
        '<p class="auth-lead">Войди, чтобы синхронизировать медиатеку и плейлисты.</p>' +
        field('Email', 'data-auth-email', 'email', 'you@example.com') +
        field('Пароль', 'data-auth-password', 'password', '••••••••') +
        field('Имя (для регистрации)', 'data-auth-name', 'text', 'Как к тебе обращаться') +
        '<div class="auth-actions">' +
          '<button type="button" class="btn primary" data-auth-action="login">' +
            (icon('check') || '') + '<span>Войти</span></button>' +
          '<button type="button" class="btn" data-auth-action="register">' +
            (icon('plus') || '') + '<span>Зарегистрироваться</span></button>' +
        '</div>' +
        '<button type="button" class="btn google-btn" data-auth-action="google">' +
          (icon('star') || '') + '<span>Войти через Google</span></button>' +
        '<button type="button" class="auth-site-link" data-auth-action="site">' +
          'Создать аккаунт на сайте</button>' +
      '</div>' +
      '<div class="backdrop" data-auth-close="1"></div>';

    root.appendChild(wrap);
    sheet = wrap;

    var emailInput = wrap.querySelector ? wrap.querySelector('[data-auth-email]') : null;
    if (emailInput && acc.email) emailInput.value = String(acc.email);

    wrap.addEventListener('click', function (event) {
      var closeEl = closestData(event.target, 'data-auth-close');
      if (closeEl) {
        closeSheet();
        return;
      }
      var actionEl = closestData(event.target, 'data-auth-action');
      if (!actionEl) return;
      var action = String(actionEl.getAttribute('data-auth-action') || '');

      if (action === 'site') {
        closeSheet();
        openUrl(REGISTER_URL);
        toast('Открываем сайт…');
        return;
      }
      if (action === 'google') {
        google();
        return;
      }
      if (action !== 'login' && action !== 'register') return;

      var emailEl = wrap.querySelector ? wrap.querySelector('[data-auth-email]') : null;
      var passEl = wrap.querySelector ? wrap.querySelector('[data-auth-password]') : null;
      var nameEl = wrap.querySelector ? wrap.querySelector('[data-auth-name]') : null;
      var emailValue = emailEl ? emailEl.value : '';
      var passValue = passEl ? passEl.value : '';
      var nameValue = nameEl ? nameEl.value : '';

      if (action === 'login') login(emailValue, passValue);
      else register(emailValue, passValue, nameValue);
    });
  }

  function init() {
    if (inited) return;
    inited = true;

    on('googlesignin', function (event) {
      onGoogleEvent(event, undefined, true);
    });
    on('apiresult', function (event) {
      onGoogleEvent(event, undefined, false);
    });

    /* Нативный мост может прислать колбэк Google сюда. Хук объявляем здесь,
       чтобы не трогать core.js (зона другого агента). */
    if (typeof TheMusic.onGoogleSignIn !== 'function') {
      TheMusic.onGoogleSignIn = function (json) {
        emit('googlesignin', parse(json) || {});
      };
    }
    if (typeof TheMusic.onGoogleSignin !== 'function') {
      TheMusic.onGoogleSignin = TheMusic.onGoogleSignIn;
    }
  }

  TheMusic.modules.Auth = {
    init: init,
    openSheet: openSheet,
    login: login,
    register: register,
    google: google,
    logout: logout,
    closeSheet: closeSheet,
    isLoggedIn: function () {
      return !!((getState().account || {}).token);
    },
    account: snapshot,
    constants: {
      siteUrl: SITE_URL,
      registerUrl: REGISTER_URL,
      oauthRedirectUri: OAUTH_REDIRECT_URI,
      googleClientId: GOOGLE_CLIENT_ID,
      paths: DEFAULT_PATHS
    }
  };

  window.TheMusic = TheMusic;
})();

  /* ------------------------- разметка экрана ------------------------ */

  function ensureScreen() {
    var el = document.querySelector('[data-screen="decoder"]');
    if (el) return el;
    var host = document.getElementById('screens') || document.body;
    el = document.createElement('section');
    el.className = 'screen';
    el.id = 'screen-decoder';
    el.setAttribute('data-screen', 'decoder');
    host.appendChild(el);
    return el;
  }

  function chipsHtml() {
    var html = '';
    for (var i = 0; i < MODES.length; i++) {
      html += '<button type="button" class="dec-chip" data-mode="' + MODES[i].id +
        '" title="' + esc(MODES[i].title) + '">' + icon(MODES[i].icon, 15) +
        '<span>' + esc(MODES[i].name) + '</span></button>';
    }
    return html;
  }

  function helpHtml() {
    var html = '';
    for (var i = 0; i < MODES.length; i++) {
      html += '<details class="dec-help-item"><summary>' + icon(MODES[i].icon, 16) +
        esc(MODES[i].title) + '</summary><p>' + esc(MODES[i].help) + '</p></details>';
    }
    return html;
  }

  /* ---------------------------- события ----------------------------- */

  function closestAttr(node, attr) {
    var el = node;
    while (el && el !== document) {
      if (el.getAttribute && el.getAttribute(attr) != null) return el;
      el = el.parentNode;
    }
    return null;
  }

  function bind(root) {
    root.addEventListener('click', function (e) {
      var chip = closestAttr(e.target, 'data-mode');
      if (chip) { setMode(chip.getAttribute('data-mode')); return; }
      var ex = closestAttr(e.target, 'data-example');
      if (ex) {
        ui.input.value = ex.getAttribute('data-example');
        st.direction = 'encrypt';
        updateCounter(); syncParams(); schedulePreview(0); updateButtons();
        ui.input.focus();
        return;
      }
      var act = closestAttr(e.target, 'data-act');
      if (act) {
        switch (act.getAttribute('data-act')) {
          case 'encrypt': apply(false, true); break;
          case 'decrypt': apply(true, true); break;
          case 'swap': doSwap(); break;
          case 'clear': doClear(); break;
          case 'copy': doCopy(); break;
          case 'share': doShare(); break;
          case 'history': openHistory(); break;
          default: break;
        }
      }
    });

    root.addEventListener('input', function (e) {
      var t = e.target;
      if (!t) return;
      if (t === ui.input) {
        updateCounter(); schedulePreview(150); updateButtons();
      } else if (t.getAttribute && t.getAttribute('data-el') === 'shift') {
        st.shift = whole(t.value);
        var label = root.querySelector('[data-el="shift-val"]');
        if (label) label.textContent = String(st.shift);
        schedulePreview(150);
      } else if (t.getAttribute && t.getAttribute('data-el') === 'key') {
        st.key = t.value; schedulePreview(150);
      }
    });

    root.addEventListener('keydown', function (e) {
      if (e.target !== ui.input) return;
      if ((e.ctrlKey || e.metaKey) && e.keyCode === 13) {
        e.preventDefault();
        apply(e.shiftKey, true);
      }
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }

  function meta(id) { return S().meta[id] || {}; }

  function artStyle(t, color) {
    var c = color || (t && meta(t.id).color);
    if (c && /^#[0-9a-f]{3,8}$/i.test(c)) {
      return 'background:linear-gradient(135deg,' + c + ',' + shade(c, -35) + ')';
    }
    var h = hash((t && (t.id || t.path || t.title)) || 'the-music') % 360;
    return 'background:linear-gradient(135deg,hsl(' + h + ',78%,62%),hsl(' + ((h + 48) % 360) + ',82%,45%))';
  }

  function shade(hex, amt) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return hex;
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = parseInt(h.substr(i * 2, 2), 16);
      v = Math.max(0, Math.min(255, v + amt));
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }

  function fmt(ms) {

  function sortTracks(arr, mode) {

      else if (mode === 'duration') { av = Number(a.duration) || 0; bv = Number(b.duration) || 0; return bv - av; }
      else if (mode === 'added') { av = Number(a.addedAt || a.dateAdded || 0); bv = Number(b.addedAt || b.dateAdded || 0); return bv - av || String(b.id).localeCompare(String(a.id)); }
      else { av = String(a.title || '').toLowerCase(); bv = String(b.title || '').toLowerCase(); }
      return av < bv ? -1 : av > bv ? 1 : 0;
    });
    return out;
  }

  function renderScreen(name) {
    var el = document.querySelector('#screens .screen[data-screen="' + name + '"]') ||
      document.querySelector('.screen[data-screen="' + name + '"]');
    if (!el) return;
    if (name === 'home') renderHome(el);
    else if (name === 'library') renderLibrary(el);
    else if (name === 'search') renderSearch(el);
    else if (name === 'playlists') renderPlaylists(el);
    else if (name === 'playlist') renderPlaylist(el);
    else if (name === 'favorites') renderFavorites(el);
    else if (name === 'track') renderTrack(el);
  }

  function render() {
    for (var i = 0; i < SCREENS.length; i++) renderScreen(SCREENS[i]);
  }

  /* ---------------- действия ---------------- */

  function playTrack(t) {
    if (!t) return;
    var s = S();
    s.recent = [t.id].concat((s.recent || []).filter(function (id) { return String(id) !== String(t.id); })).slice(0, 24);
    save();
    native('play', JSON.stringify(t));
    go('player');
  }

  function playNext(t) {
    if (!t) return;
    var s = S(), q = s.tracks.slice(), cur = s.player && s.player.currentId;
    q = q.filter(function (x) { return String(x.id) !== String(t.id); });
    var idx = -1;
    for (var i = 0; i < q.length; i++) if (String(q[i].id) === String(cur)) { idx = i; break; }
    q.splice(idx >= 0 ? idx + 1 : 0, 0, t);
    native('setQueue', JSON.stringify(q));
    toast('Следующим: ' + (t.title || 'трек'));
  }

  function playAll(tracks) {
    if (!tracks.length) { toast('В плейлисте нет треков'); return; }
    native('setQueue', JSON.stringify(tracks));
    native('play', JSON.stringify(tracks[0]));
    go('player');
  }

  function toggleIn(arrName, id, label) {
    var key = String(id);
    var on;
    if (arrName === 'favorites' && typeof Core.toggleFav === 'function') on = Core.toggleFav(key);
    else if (arrName === 'pins' && typeof Core.togglePin === 'function') on = Core.togglePin(key);
    else {
      var s = S();
      s[arrName] = s[arrName] || [];
      var i = -1;
      for (var k = 0; k < s[arrName].length; k++) if (String(s[arrName][k]) === key) { i = k; break; }
      on = i < 0;
      if (on) s[arrName].push(key); else s[arrName].splice(i, 1);
      save();
      emit('state', s);
    }
    syncIcons();
    toast((on ? 'Добавлено в ' : 'Удалено из ') + label);
  }

  var lastFavSig = null, lastPinSig = null;
  function syncIcons() {
    var s = S();
    var favSig = (s.favorites || []).join('|'), pinSig = (s.pins || []).join('|');
    if (favSig === lastFavSig && pinSig === lastPinSig) return;
    lastFavSig = favSig; lastPinSig = pinSig;
    var hearts = document.querySelectorAll('.tm-screen [data-fav]');
    for (var i = 0; i < hearts.length; i++) {
      var el = hearts[i], on = isFav(el.getAttribute('data-fav'));
      el.classList.toggle('active', on);
      if (el.classList && el.classList.contains('tm-iconbtn') && el.innerHTML.indexOf('tm-ico') >= 0) el.innerHTML = ico(on ? 'heart' : 'heartO');
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    var pins = document.querySelectorAll('.tm-screen [data-pin]');
    for (var j = 0; j < pins.length; j++) {
      var pe = pins[j], pinned = isPin(pe.getAttribute('data-pin'));
      pe.classList.toggle('pin-active', pinned);
      if (s.pins.indexOf(String(pe.getAttribute('data-pin'))) >= 0) { /* no-op */ }
    }
  }

  function createPlaylist(name, color) {
    name = String(name || '').trim() || 'Новый плейлист';
    var p = null, res;
    if (typeof Core.addPlaylist === 'function') {
      try {
        res = Core.addPlaylist.length >= 2 ? Core.addPlaylist(name, color) : Core.addPlaylist({
          name: name, color: color, icon: 'music', trackIds: [], createdAt: Date.now()
        });
      } catch (e) { res = null; }
    }
    if (res && typeof res === 'object') p = res;
    if (!p && res) p = findPlaylist(res);
    var arr = S().playlists;
    if (!p && arr.length && arr[arr.length - 1].name === name) p = arr[arr.length - 1];
    if (!p) {
      p = { id: 'p' + Date.now() + Math.floor(Math.random() * 1000), name: name, color: color, icon: 'music', trackIds: [], createdAt: Date.now() };
      arr.push(p);
    }
    p.color = p.color || color;
    save();
    changed();
    return p;
  }

  function addToPlaylist(plId, trackId) {
    var p = findPlaylist(plId);
    if (!p) { toast('Плейлист не найден'); return; }
    if (typeof Core.addToPlaylist === 'function') Core.addToPlaylist(p.id, trackId);
    else {
      p.trackIds = p.trackIds || [];
      if (p.trackIds.indexOf(String(trackId)) < 0) p.trackIds.push(String(trackId));
      save();
      emit('playlists', S().playlists);
      emit('state', S());
    }
    changed();
    toast('Добавлено в «' + (p.name || 'плейлист') + '»');
    if (routeInfo.name === 'playlist') renderScreen('playlist');
  }

  function copyText(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e) { return false; }
  }

  function shareTrack(t) {
    if (!t) return;
    var m = meta(t.id);
    var text = (t.title || 'Без названия') + ' — ' + (t.artist || 'Неизвестный исполнитель') +
      (t.album ? '\nАльбом: ' + t.album : '') +
      (m.description ? '\n' + m.description : '') +
      (m.note ? '\n\nЗаметки:\n' + m.note : '') +
      ((m.tags || []).length ? '\nТеги: ' + m.tags.join(', ') : '') +
      '\n\nThe Music';
    try {
      if (window.Native && typeof window.Native.shareText === 'function') {
        window.Native.shareText(text);
        toast('Отправлено');
        return;
      }
    } catch (e) { /* fallthrough */ }
    if (navigator && typeof navigator.share === 'function') {
      navigator.share({ title: t.title || 'The Music', text: text }).then(function () {
        toast('Отправлено');
      }).catch(function () {
        toast(copyText(text) ? 'Скопировано' : 'Не удалось поделиться');
      });
      return;
    }
    toast(copyText(text) ? 'Текст скопирован' : 'Не удалось скопировать');
  }

  function saveTrack(id) {
    var t = findTrack(id);
    if (!t) return;
    function val(sel) { var e = document.querySelector(sel); return e ? String(e.value || '').trim() : ''; }
    var title = val('#tm-tr-title') || t.title;
    t.title = title;
    var m = meta(t.id);
    var out = {
      title: title,
      author: val('#tm-tr-author'),
      description: val('#tm-tr-desc'),
      note: val('#tm-tr-note'),
      tags: val('#tm-tr-tags').split(',').map(function (x) { return x.trim(); }).filter(Boolean),
      rating: editor.rating,
      color: editor.color || val('#tm-tr-color-custom') || m.color || ''
    };
    out.notes = out.note;
    if (typeof Core.setMeta === 'function') Core.setMeta(String(t.id), out);
    else S().meta[t.id] = out;
    save();
    toast('Сохранено');
    editor.id = null;
    renderScreen('track');
    changed();
  }
