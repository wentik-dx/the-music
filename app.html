  function ensureSheet() {
    if (E.sheet && E.sheet.parentNode) return;
    var root = document.getElementById('overlay-root') || document.body;
    var back = document.createElement('div');
    back.className = 'pl-sheet-backdrop';
    back.id = 'pl-queue-sheet';
    back.innerHTML = [
      '<div class="sheet pl-sheet" id="pl-sheet">',
      '<div class="pl-sheet-head"><b class="sheet-title">Очередь воспроизведения</b>',
      '<button class="pl-ico" data-act="close-queue" title="Закрыть">✕</button></div>',
      '<div class="pl-sheet-list" id="pl-sheet-list"></div>',
      '<div class="pl-sheet-foot"><button data-act="clear-queue">Очистить очередь</button>',
      '<button data-act="close-queue">Готово</button></div>',
      '</div>'
    ].join('');
    root.appendChild(back);
    E.sheet = back;
    E.sheetList = document.getElementById('pl-sheet-list');
    back.addEventListener('click', function (e) {
      if (e.target === back) closeQueue();
      else {
        var a = findAct(e.target);
        if (a) onAction(a, e);
      }
    });
  }

  /* -------------------------------------------------------------- events */

  function findAct(node) {
    while (node && node !== document.body) {
      if (node.getAttribute && node.getAttribute('data-act')) return node;
      node = node.parentNode;
    }
    return null;
  }

  function onMiniClick(e) {
    var a = findAct(e.target);
    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
    if (a) { onAction(a, e); return; }
    go('player');
  }

  function onClick(e) {
    var a = findAct(e.target);
    if (a) { onAction(a, e); return; }
    if (E.sleepMenu && E.sleepMenu.classList.contains('open')) E.sleepMenu.classList.remove('open');
  }

  function onAction(a, e) {
    var act = a.getAttribute('data-act');
    var n = parseInt(a.getAttribute('data-n'), 10) || 0;
    var c = C();
    var s = c && c.state;
    var t = currentTrack();
    if (e) e.stopPropagation();

    switch (act) {
      case 'back':
        if (c && typeof c.back === 'function') c.back(); else go('home');
        break;
      case 'settings': go('settings'); break;
      case 'queue': openQueue(); break;
      case 'close-queue': closeQueue(); break;
      case 'play': case 'toggle': case 'mtoggle':
        if (s && s.player && s.player.playing) doPause(); else doPlay(t);
        break;
      case 'next': apiNext(); break;
      case 'prev': apiPrev(); break;
      case 'shuffle':
        if (s && s.settings) {
          s.settings.shuffle = !s.settings.shuffle;
          native('setShuffle', !!s.settings.shuffle);
          save(); render();
        }
        break;
      case 'repeat':
        if (s && s.settings) {
          s.settings.repeat = ((Number(s.settings.repeat) || 0) + 1) % 3;
          native('setRepeat', s.settings.repeat);
          save(); render();
        }
        break;
      case 'fav':
        if (!t) break;
        toggleList('favorites', t.id);
        toast(inList('favorites', t.id) ? 'Добавлено в избранное' : 'Убрано из избранного');
        render();
        break;
      case 'pin':
        if (!t) break;
        toggleList('pins', t.id);
        toast(inList('pins', t.id) ? 'Трек закреплён' : 'Трек откреплён');
        render();
        break;
      case 'rate':
        if (!t || !s) break;
        s.meta = s.meta || {};
        s.meta[t.id] = s.meta[t.id] || {};
        s.meta[t.id].rating = (s.meta[t.id].rating === n) ? 0 : n;
        save(); emit('state', s); render();
        break;
      case 'sleep':
        if (E.sleepMenu) E.sleepMenu.classList.toggle('open');
        break;
      case 'sleep-min':
        startSleep(n);
        if (E.sleepMenu) E.sleepMenu.classList.remove('open');
        break;
      case 'sleep-off':
        stopSleep(true);
        if (E.sleepMenu) E.sleepMenu.classList.remove('open');
        break;
      case 'info':
        if (t) {
          if (s) s.selectedTrackId = t.id;
          if (T.TrackEditor && typeof T.TrackEditor.open === 'function') T.TrackEditor.open(t.id);
          else if (c && typeof c.openTrack === 'function') c.openTrack(t.id);
          emit('edittrack', t);
          if (c && typeof c.go === 'function') c.go('track', { id: t.id }); else go('track');
        }
        break;
      case 'queue-play': case 'row-play': {
        var id = a.getAttribute('data-id') || '';
        var qt = findTrack(id);
        if (qt) doPlay(qt, true);
        break;
      }
      case 'row-remove': {
        var rid = a.getAttribute('data-id') || '';
        removeFromQueue(rid);
        break;
      }
      case 'clear-queue':
        if (s) { ensureQueue(); s.queueIds = []; save(); emit('state', s); render(); }
        break;
      default: break;
    }
  }

  function inList(name, id) {
    var c = C();
    var arr = c && c.state && c.state[name];
    return !!(arr && id && arr.indexOf(id) >= 0);
  }

  function toggleList(name, id) {
    var c = C();
    if (!c || !c.state) return;
    ensureQueue();
    var arr = c.state[name] || (c.state[name] = []);
    var i = arr.indexOf(id);
    if (i >= 0) arr.splice(i, 1); else arr.push(id);
    save(); emit('state', c.state);
  }

  function nextTrack(dir) {
    var list = queueTracks();
    var id = currentTrack() && currentTrack().id;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) {
      var k = (i + (dir || 1) + list.length) % list.length;
      return list[k];
    }
    return list.length ? list[dir > 0 ? 0 : list.length - 1] : null;
  }

  function syncNativeQueue() {
    var list = queueTracks();
    if (list.length > 1) native('setQueue', JSON.stringify(list));
  }

  function doPlay(track, fromQueue) {
    var c = C();
    if (!c || !c.state) return;
    var s = c.state;
    if (!track) {
      if (s.player && s.player.playing) native('resume');
      else {
        track = nextTrack(1);
        if (track) doPlay(track, true);
      }
      return;
    }
    s.player = s.player || {};
    s.player.currentId = track.id;
    s.player.current = track;
    s.player.duration = Number(track.duration) || s.player.duration || 0;
    s.player.position = 0;
    s.player.playing = true;
    if (fromQueue) syncNativeQueue();
    native('play', JSON.stringify(track));
    if (s.recent) {
      var i = s.recent.indexOf(track.id);
      if (i >= 0) s.recent.splice(i, 1);
      s.recent.unshift(track.id);
      if (s.recent.length > 50) s.recent.length = 50;
    }
    save(); emit('state', s); render();
  }

  function doPause() {
    var c = C();
    native('pause');
    if (c && c.state && c.state.player) { c.state.player.playing = false; emit('state', c.state); }
    render();
  }

  function seekTo(ms) {
    var c = C();
    var s = c && c.state;
    var p = s && s.player;
    if (!p) return;
    p.position = Math.max(0, Math.min(Number(ms) || 0, Number(p.duration) || 0));
    native('seekTo', Math.round(p.position));
    render();
  }

  function bindProgress() {
    if (!E.progress) return;
    function fromEvent(e) {
      var r = E.progress.getBoundingClientRect();
      if (!r.width) return;
      var ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      var c = C();
      var dur = c && c.state && c.state.player && c.state.player.duration;
      dragPos = Math.round(ratio * (Number(dur) || 0));
      if (E.fill) E.fill.style.width = (ratio * 100).toFixed(2) + '%';
      if (E.knob) E.knob.style.left = (ratio * 100).toFixed(2) + '%';
      setText(E.pos, fmt(dragPos));
    }
    E.progress.addEventListener('pointerdown', function (e) {
      pointerUsed = true; dragging = true; fromEvent(e);
      try { E.progress.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    });
    E.progress.addEventListener('pointermove', function (e) { if (dragging) fromEvent(e); });
    E.progress.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      dragging = false; fromEvent(e);
      if (dragPos >= 0) seekTo(dragPos);
    });
    E.progress.addEventListener('click', function (e) {
      if (pointerUsed) { pointerUsed = false; return; }
      fromEvent(e);
      if (dragPos >= 0) seekTo(dragPos);
    });
  }

  function bindVolume() {
    if (!E.vol) return;
    E.vol.addEventListener('pointerdown', function () { volDragging = true; });
    window.addEventListener('pointerup', function () { volDragging = false; });
    E.vol.addEventListener('input', function () {
      var v = Math.max(0, Math.min(1, (Number(E.vol.value) || 0) / 100));
      var c = C();
      if (c && c.state && c.state.settings) c.state.settings.volume = v;
      native('setVolume', v);
      save();
    });
  }

  /* --------------------------------------------------------- sleep timer */

  function startSleep(minutes) {
    stopSleep(false);
    sleep.minutes = minutes;
    sleep.until = Date.now() + minutes * 60000;
    sleep.timer = window.setInterval(tickSleep, 1000);
    toast('Таймер сна: ' + minutes + ' мин');
    renderSleep();
  }

   * player.js меняет текст только у вложенного <span>, наша кнопка переживёт. */
  function injectPlayer() {
    var screen = findScreen('player');
    if (!screen) return;
    var anchor = screen.querySelector('.pl-info') || screen.querySelector('#pl-title') ||
      screen.querySelector('.pl-head');
    if (!anchor || !anchor.parentNode) return;
    var id = currentPlayerId();
    var btn = findButton(screen);
    if (!id) {
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
      return;
    }
    if (btn && btn.getAttribute('data-av-btn') !== id) {
      btn.parentNode.removeChild(btn);
      btn = null;
    }
    if (!btn) {
      btn = makeButton(id, 40);
      if (anchor === screen.querySelector('.pl-info')) anchor.insertBefore(btn, anchor.firstChild);
      else anchor.parentNode.insertBefore(btn, anchor);
    } else {
      btn.innerHTML = html(id, 40);
    }
  }

  function refresh() {
    if (!doc || !doc.querySelector) return;
    var s = st();
    var route = s && s.route ? String(s.route) : '';
    if (route === 'track') {
      var screen = findScreen('track');
      var params = s && s.routeParams ? s.routeParams : {};
      var id = params.id || currentTrackId || currentPlayerId();
      if (screen && id) injectTrack(screen, String(id));
    }
    injectPlayer();
  }

  /* Сетка вариантов: сначала «лица» из IconPack, потом emoji-фолбэки. */
  function buildOptions() {
    var out = [];
    var seen = {};
    var pack = iconPack();
    var names = [];
    if (pack && typeof pack.names === 'function') {
      try { names = pack.names() || []; } catch (e) { names = []; }
    }
    if (!Array.isArray(names)) names = [];

    var preferred = [];
    var i;
    for (i = 0; i < names.length; i++) {
      var name = String(names[i] == null ? '' : names[i]).trim();
      if (!name || seen[name]) continue;
      if (/avatar|face|cat|dog|fox|bear|panda|frog|owl|pet|mood|char|hero|emoji|smile|user/i.test(name)) {
        preferred.push(name);
      }
    }
    var pool = preferred.length ? preferred : names;
    for (i = 0; i < pool.length && out.length < 24; i++) {
      var key = String(pool[i] == null ? '' : pool[i]).trim();
      if (!key || seen[key]) continue;
      var src = packSrc(key, 48);
      if (!src && !packHas(key)) continue;
      if (!src) continue;
      seen[key] = 1;
      out.push({ value: key, src: src, label: prettyName(key) });
    }
    for (i = 0; i < FALLBACK.length && out.length < 24; i++) {
      var item = FALLBACK[i];
      var value = 'emoji:' + item.emoji;
      if (seen[value]) continue;
      seen[value] = 1;
      out.push({ value: value, emoji: item.emoji, label: item.name });
    }
    return out.slice(0, 24);
  }

  function closeSheet() {
    if (!sheetEl) return;
    if (sheetEl.parentNode) sheetEl.parentNode.removeChild(sheetEl);
    sheetEl = null;
  }

  function findData(node, key) {
    while (node && node !== sheetEl) {
      if (node.getAttribute && node.getAttribute(key) != null) return node;
      node = node.parentNode;
    }
    return null;
  }

  function onSheetClick(event) {
    var target = event.target;
    if (!target) return;
    if (event.stopPropagation) event.stopPropagation();
    if (event.preventDefault) event.preventDefault();

    if (findData(target, 'data-av-close')) { closeSheet(); return; }
    if (findData(target, 'data-av-upload')) {
      var c = core();
      if (c && typeof c.native === 'function') c.native('pickImage');
      toast('Выбери фото из галереи');
      return;
    }
    if (findData(target, 'data-av-reset')) {
      setAvatar(currentTrackId, '');
      closeSheet();
      return;
    }
    var option = findData(target, 'data-av-value');
    if (option) {
      setAvatar(currentTrackId, option.getAttribute('data-av-value'));
      closeSheet();
    }
  }

  function onKey(event) {
    if (!sheetEl || !event || event.keyCode !== 27) return;
    closeSheet();
  }

  /* Публичный API №3: picker(trackId) — красивый bottom-sheet. */
  function picker(trackId) {
    if (!doc || !doc.querySelector || !doc.createElement) return false;
    var s = st();
    var id = trackId == null || trackId === '' ? '' : String(trackId);
    if (!id) {
      var params = s && s.routeParams ? s.routeParams : {};
      id = params.id || currentPlayerId();
    }
    if (!id) {
      toast('Сначала открой трек');
      return false;
    }
    currentTrackId = id;
    closeSheet();

    var host = doc.getElementById('overlay-root') || doc.body;
    if (!host) return false;

    var wrap = doc.createElement('div');
    wrap.className = 'avatar-picker';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('data-no-swipe', '');
    wrap.innerHTML =
      '<div class="avatar-picker-backdrop" data-av-close="1"></div>' +
      '<div class="avatar-sheet">' +
        '<div class="avatar-sheet-head">' +
          '<div class="avatar-current" data-av-current>' + html(id, 56) + '</div>' +
          '<div class="avatar-sheet-copy">' +
            '<div class="avatar-sheet-title">Аватар трека</div>' +
            '<div class="avatar-sheet-sub">' + esc(titleOf(id)) + '</div>' +
          '</div>' +
          '<button type="button" class="avatar-close" data-av-close="1" aria-label="Закрыть">\u2715</button>' +
        '</div>' +
        '<div class="avatar-grid" data-av-grid></div>' +
        '<div class="avatar-actions">' +
          '<button type="button" class="avatar-upload" data-av-upload="1">\u2191 Загрузить своё</button>' +
          '<button type="button" class="avatar-reset" data-av-reset="1">\u21BB Сбросить</button>' +
        '</div>' +
      '</div>';

    var grid = wrap.querySelector('[data-av-grid]');
    var options = buildOptions();
    var current = getAvatar(id);
    var markup = '';
    for (var i = 0; i < options.length; i++) {
      var o = options[i];
      var body = o.src
        ? '<img class="png-ico" src="' + esc(o.src) + '" alt="">'
        : '<span class="avatar-emoji">' + esc(o.emoji || '\u266A') + '</span>';
      markup += '<button type="button" class="avatar-opt' + (o.value === current ? ' active' : '') +
        '" data-av-value="' + esc(o.value) + '" title="' + esc(o.label) +
        '" aria-label="' + esc(o.label) + '">' + body + '</button>';
    }
    if (grid) grid.innerHTML = markup;

    wrap.addEventListener('click', onSheetClick);
    host.appendChild(wrap);
    sheetEl = wrap;
    return true;
  }

  function updateCurrent(id) {
    if (!sheetEl || id !== currentTrackId) return;
    var preview = sheetEl.querySelector('[data-av-current]');
    if (preview) preview.innerHTML = html(id, 56);
    var opts = sheetEl.querySelectorAll('[data-av-value]');
    var current = getAvatar(id);
    for (var i = 0; i < opts.length; i++) {
      var active = opts[i].getAttribute('data-av-value') === current;
      if (opts[i].classList) opts[i].classList.toggle('active', active);
      else opts[i].setAttribute('data-active', active ? '1' : '');
    }
  }

  /* Хук нативного пикера: агент 1 делает TheMusic.onImagePicked(dataUrl) ->
   * Core.emit('imagepicked', dataUrl). trackId помним из последнего picker(). */
  function onImagePicked(payload) {
    var value = payload;
    if (payload && typeof payload === 'object') {
      value = payload.dataUrl || payload.data || payload.url || payload.base64 || '';
    }
    value = trim(value);
    if (!value && typeof payload === 'string') value = trim(payload);
    if (/^[A-Za-z0-9+/=\s]{100,}$/.test(value)) value = 'data:image/jpeg;base64,' + value.replace(/\s/g, '');
    if (!/^data:image\//i.test(value)) {
      toast('Не вышло загрузить фото');
      return false;
    }
    var s = st();
    var params = s && s.routeParams ? s.routeParams : {};
    var id = currentTrackId || params.id || currentPlayerId();
    if (!id) {
      toast('Сначала открой трек');
      return false;
    }
    currentTrackId = String(id);
    setAvatar(currentTrackId, value);
    closeSheet();
    return true;
  }

  /* Публичный API №4: init() — идемпотентный и безопасный. */
  function init() {
    if (ready) return true;
    var c = core();
    if (!c || typeof c.on !== 'function' || !doc || !doc.querySelector) return false;
    ready = true;

    c.on('route', function (arg) {
      refresh();
      if (win.setTimeout) win.setTimeout(refresh, 0);
    });
    c.on('library', refresh);
    c.on('trackchange', refresh);
    c.on('avatarchange', function (data) {
      updateCurrent(data && data.id ? String(data.id) : currentTrackId);
      refresh();
      if (win.setTimeout) win.setTimeout(refresh, 0);
    });
    c.on('imagepicked', onImagePicked);
    if (doc.addEventListener) doc.addEventListener('keydown', onKey, false);
    refresh();
    return true;
  }

  TheMusic.modules.Avatar = {
    init: init,
    picker: picker,
    url: url,
    html: html
  };
})();


/* ===== autoplaylists.js ===== */
'use strict';
/* The Music v1.2 — авто-плейлисты по папкам (фича №4).
   Только DOM-инъекция в экран playlists; library.js не трогаем. */
(function () {
  var TheMusic = window.TheMusic || (window.TheMusic = {});
  TheMusic.modules = TheMusic.modules || {};

  var Core = TheMusic.Core;
  var inited = false;
  var injectTimer = null;

  var FOLDER_ICON = '<svg class="tm-ico auto-pl-ico-svg" viewBox="0 0 24 24" fill="currentColor" ' +
    'aria-hidden="true"><path d="M3 6h7l2 2h9v11H3V6zm2 2v9h14v-7h-9.4L10.6 8H5z"/></svg>';

  function getCore() {
    if (!Core && TheMusic.Core) Core = TheMusic.Core;
    return Core && Core.state ? Core : null;
  }

  function esc(value) {
    var c = getCore();
    if (c && typeof c.esc === 'function') return c.esc(value);
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* Простой стабильный хэш строки (djb2) → короткий base36-суффикс. */
  function hashString(value) {
    var s = String(value == null ? '' : value);
    var h = 5381;
    var i;
    for (i = 0; i < s.length; i++) {
      h = (((h << 5) + h + s.charCodeAt(i)) | 0) >>> 0;
    }
    return h.toString(36);
  }

  /* Возвращает {folder, name} для пути трека или null, если папки нет. */
  function folderInfo(rawPath) {
    var p = String(rawPath == null ? '' : rawPath).replace(/\\/g, '/');
    if (!p) return null;

    if (p.indexOf('asset:') === 0) {
      var rest = p.slice(6);
      var assetSlash = rest.lastIndexOf('/');
      return {
        folder: assetSlash >= 0 ? 'asset:' + rest.slice(0, assetSlash) : 'asset:demo',
        name: 'Демо'
      };
    }

    while (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1);
    var slash = p.lastIndexOf('/');
    if (slash <= 0 || slash === p.length - 1) return null;
    var folder = p.slice(0, slash);
    var nameSlash = folder.lastIndexOf('/');
    var name = folder.slice(nameSlash + 1);
    if (!name) return null;
    return { folder: folder, name: name };
  }

  function plural(count) {
    var n = Math.abs(Math.floor(Number(count) || 0)) % 100;
    var last = n % 10;
    if (n > 10 && n < 20) return 'треков';
    if (last === 1) return 'трек';
    if (last >= 2 && last <= 4) return 'трека';
    return 'треков';
  }

  function rebuild() {
    var c = getCore();
    if (!c) return [];

    var prev = c.state.autoPlaylists;
    var created = {};
    var i;
    if (Array.isArray(prev)) {
      for (i = 0; i < prev.length; i++) {
        if (prev[i] && prev[i].id != null) created[String(prev[i].id)] = Number(prev[i].createdAt) || 0;
      }
    }

    var tracks = Array.isArray(c.state.tracks) ? c.state.tracks : [];
    var groups = {};
    var order = [];
    for (i = 0; i < tracks.length; i++) {
      var t = tracks[i];
      if (!t || typeof t !== 'object') continue;
      var info = folderInfo(t.path);
      var id = t.id == null ? '' : String(t.id);
      if (!info || !id) continue;
      if (!groups[info.folder]) {
        groups[info.folder] = { folder: info.folder, name: info.name, ids: [], seen: {} };
        order.push(info.folder);
      }
      if (!groups[info.folder].seen[id]) {
        groups[info.folder].seen[id] = 1;
        groups[info.folder].ids.push(id);
      }
    }

    var list = [];
    for (i = 0; i < order.length; i++) {
      var g = groups[order[i]];
      var plId = 'auto:' + hashString(g.folder);
      list.push({
        id: plId,
        name: g.name,
        folder: g.folder,
        trackIds: g.ids.slice(),
        createdAt: created[plId] || Date.now(),
        auto: true
      });
    }
    list.sort(function (a, b) {
      if (a.name < b.name) return -1;
      if (a.name > b.name) return 1;
      if (a.folder < b.folder) return -1;
      if (a.folder > b.folder) return 1;
      return 0;
    });

    c.state.autoPlaylists = list;
    try { c.save(); } catch (e) {}
    if (typeof c.emit === 'function') c.emit('autoplaylists', list);
    return list;
  }

  function all() {
    var c = getCore();
    var src = c && Array.isArray(c.state.autoPlaylists) ? c.state.autoPlaylists : [];
    var out = [];
    for (var i = 0; i < src.length; i++) {
      var p = src[i];
      if (!p) continue;
      out.push({
        id: p.id,
        name: p.name,
        folder: p.folder,
        trackIds: Array.isArray(p.trackIds) ? p.trackIds.slice() : [],
        createdAt: p.createdAt,
        auto: true
      });
    }
    return out;
  }

  function sectionHtml() {
    var list = all();
    var head = '<div class="tm-sec-h"><h3>Авто-плейлисты</h3>' +
      '<span class="auto-pl-total">' + list.length + '</span></div>';

    if (!list.length) {
      return '<section class="auto-pl-section" data-auto-pl-section>' + head +
        '<div class="auto-pl-empty">Папки с треками появятся здесь сами</div></section>';
    }

    var c = getCore();
    var cards = [];
    for (var i = 0; i < list.length; i++) {
      var pl = list[i];
      var ids = pl.trackIds;
      var rows = [];
      for (var j = 0; j < ids.length; j++) {
        var track = c && typeof c.getTrack === 'function' ? c.getTrack(ids[j]) : null;
        var title = track ? track.title : ids[j];
        var subtitle = track && track.artist ? track.artist : '';
        rows.push('<button type="button" class="auto-pl-track" data-auto-pl-track="' + esc(ids[j]) +
          '" data-auto-pl-pl="' + esc(pl.id) + '">' +
          '<span class="auto-pl-tname">' + esc(title) + '</span>' +
          (subtitle ? '<span class="auto-pl-tartist">' + esc(subtitle) + '</span>' : '') +
          '</button>');
      }
      cards.push('<div class="auto-pl-card" data-auto-pl-card="' + esc(pl.id) + '">' +
        '<button type="button" class="auto-pl-head" data-auto-pl-toggle="' + esc(pl.id) + '">' +
          '<span class="auto-pl-ico">' + FOLDER_ICON + '</span>' +
          '<span class="auto-pl-name">' + esc(pl.name) + '</span>' +
          '<span class="auto-pl-count">' + ids.length + ' ' + plural(ids.length) + '</span>' +
        '</button>' +
        '<div class="auto-pl-tracks" hidden style="display:none">' +
          (rows.length ? rows.join('') : '<div class="auto-pl-empty">В папке нет треков</div>') +
        '</div></div>');
    }
    return '<section class="auto-pl-section" data-auto-pl-section>' + head +
      '<div class="auto-pl-list">' + cards.join('') + '</div></section>';
  }

  /* ---------- DOM-инъекция ---------- */

  function playlistsScreen() {
    if (typeof document === 'undefined' || !document.querySelector) return null;
    return document.querySelector('#screens [data-screen="playlists"]') ||
      document.querySelector('[data-screen="playlists"]');
  }

  function hasClass(el, name) {
    if (!el) return false;
    if (el.classList && typeof el.classList.contains === 'function') return el.classList.contains(name);
    return typeof el.className === 'string' &&
      (' ' + el.className + ' ').indexOf(' ' + name + ' ') >= 0;
  }

  function setClass(el, name, on) {
    if (!el) return;
    if (el.classList) {
      if (on) el.classList.add(name); else el.classList.remove(name);
      return;
    }
    var parts = String(el.className || '').split(/\s+/);
    var out = [];
    var found = false;
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === name) { found = true; if (!on) continue; }
      if (parts[i]) out.push(parts[i]);
    }
    if (on && !found) out.push(name);
    el.className = out.join(' ');
  }

  function inject() {
    var screen = playlistsScreen();
    if (!screen || typeof document.createElement !== 'function') return;

    var body = screen.querySelector('.screen-body');
    if (!body) {
      body = document.createElement('div');
      body.className = 'screen-body';
      while (screen.firstChild) body.appendChild(screen.firstChild);
      screen.appendChild(body);
    }

    var open = {};
    var existing = body.querySelector('.auto-pl-section') || screen.querySelector('.auto-pl-section');
    if (existing) {
      var oldCards = existing.querySelectorAll ? existing.querySelectorAll('.auto-pl-card.open') : [];
      for (var k = 0; k < oldCards.length; k++) {
        var key = oldCards[k].getAttribute && oldCards[k].getAttribute('data-auto-pl-card');
        if (key) open[key] = 1;
      }
    }

    var wrap = document.createElement('div');
    wrap.innerHTML = sectionHtml();
    var fresh = wrap.firstChild;
    if (!fresh) return;

    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
    body.insertBefore(fresh, body.firstChild);

    var cards = fresh.querySelectorAll ? fresh.querySelectorAll('.auto-pl-card') : [];
    for (var i = 0; i < cards.length; i++) {
      var cardId = cards[i].getAttribute('data-auto-pl-card');
      if (!cardId || !open[cardId]) continue;
      setClass(cards[i], 'open', true);
      var box = cards[i].querySelector('.auto-pl-tracks');
      if (box) { box.hidden = false; box.style.display = ''; }
    }
  }

  function deferInject() {
    if (!getCore() || typeof window.setTimeout !== 'function') return;
    if (injectTimer) return;
    injectTimer = window.setTimeout(function () {
      injectTimer = null;
      inject();
    }, 0);
  }

  /* ---------- клики ---------- */

  function closestAttr(node, attr) {
    var cur = node;
    while (cur && cur !== document) {
      if (cur.getAttribute && cur.getAttribute(attr) != null) return cur;
      cur = cur.parentNode;
    }
    return null;
  }

  function closestClass(node, name) {
    var cur = node;
    while (cur && cur !== document) {
      if (hasClass(cur, name)) return cur;
      cur = cur.parentNode;
    }
    return null;
  }

  function toggleCard(id) {
    if (!id || typeof document.querySelectorAll !== 'function') return;
    var cards = document.querySelectorAll('.auto-pl-card');
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('data-auto-pl-card') !== id) continue;
      var next = !hasClass(cards[i], 'open');
      setClass(cards[i], 'open', next);
      var box = cards[i].querySelector('.auto-pl-tracks');
      if (box) {
        box.hidden = !next;
        box.style.display = next ? '' : 'none';
      }
      return;
    }
  }

  function playFromCard(el) {
    var c = getCore();
    if (!c) return;
    var trackId = el.getAttribute('data-auto-pl-track');
    var plId = el.getAttribute('data-auto-pl-pl');
    if (!trackId) return;

    var track = typeof c.getTrack === 'function' ? c.getTrack(trackId) : null;
    if (!track) return;

    var ids = [];
    var list = Array.isArray(c.state.autoPlaylists) ? c.state.autoPlaylists : [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && String(list[i].id) === String(plId)) {
        ids = Array.isArray(list[i].trackIds) ? list[i].trackIds.slice() : [];
        break;
      }
    }
    if (!ids.length) ids = [trackId];

    try {
      if (typeof c.native === 'function') {
        c.native('setQueue', JSON.stringify(ids));
        c.native('play', JSON.stringify(track));
      }
    } catch (e) {}
    if (typeof c.go === 'function') c.go('player');
  }

  function onClick(e) {
    var target = e && e.target;
    if (!target || !target.getAttribute) return;
    var trackEl = closestAttr(target, 'data-auto-pl-track');
    if (trackEl) { playFromCard(trackEl); return; }
    var toggleEl = closestAttr(target, 'data-auto-pl-toggle');
    if (toggleEl) { toggleCard(toggleEl.getAttribute('data-auto-pl-toggle')); return; }
    var cardEl = closestClass(target, 'auto-pl-card');
    if (cardEl) toggleCard(cardEl.getAttribute('data-auto-pl-card'));
  }

  /* ---------- init ---------- */

  function init() {
    if (inited) return;
    var c = getCore();
    if (!c) return;
    inited = true;
    TheMusic.modules.AutoPlaylists._inited = true;
    TheMusic.modules.AutoPlaylists['data-init'] = '1';

    rebuild();
    inject();

    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('click', onClick, false);
    }
    if (typeof c.on === 'function') {
      c.on('library', function () { rebuild(); deferInject(); });
      c.on('ready', function () { rebuild(); deferInject(); });
      c.on('state', function () { rebuild(); deferInject(); });
      c.on('route', function (arg) {
        var name = '';
        if (typeof arg === 'string') name = arg;
        else if (arg && typeof arg === 'object') name = arg.screen || arg.name || arg.route || '';
        if (!name && c.state && c.state.route) name = String(c.state.route);
        if (String(name) === 'playlists') { inject(); deferInject(); }
      });
      c.on('autoplaylists', deferInject);
    }
  }

  var AutoPlaylists = {
    init: init,
    rebuild: rebuild,
    all: all,
    sectionHtml: sectionHtml
  };
  TheMusic.modules.AutoPlaylists = AutoPlaylists;

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading' && document.addEventListener) {
      document.addEventListener('DOMContentLoaded', init, false);
    } else if (typeof window.setTimeout === 'function') {
      window.setTimeout(init, 0);
    } else {
      init();
    }
  }
})();


/* ===== plays.js ===== */
'use strict';
/* The Music v1.2 — фича №13: локальный счётчик прослушиваний.
 * Публичный API: TheMusic.modules.Plays = {
 *   init, count(id), record(id), stats(id), badgeHtml(id), sectionHtml()
 * }
 * Данные: Core.state.plays[id] = { count:Number, last:Number, seconds:Number }
 * Ничего не трогаем в library.js / player.js / main.js — только DOM-инъекция.
 */
(function () {
  var T = window.TheMusic = window.TheMusic || {};
  var inited = false;
  var module = null;

  /* Наблюдатель за нативным состоянием плеера.
   * obs.pos — предыдущая позиция в мс, obs.pending — неслитый остаток секунд.
   * seconds накапливаем по DELTA позиции, а не по wall-clock:
   * таймер/свернутый экран/пауза не должны прибавлять время. */
  var obs = { id: null, pos: 0, playing: false, pending: 0 };
  var FLUSH = 30;      // секунд активной игры до записи в state
  var DEDUPE = 3000;   // мс: защита от двойного счёта trackchange + state
  var SEEK_GUARD = 60000; // мс: прыжок больше минуты считаем перемоткой

  function C() { return T.Core || null; }

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function esc(v) {
    var c = C();
    if (c && typeof c.esc === 'function') return c.esc(v);
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
    });
  }

  function num(v, fallback) {
    var n = Number(v);
    return isFinite(n) ? n : (fallback || 0);
  }

  function icon(name, fallback) {
    var c = C();
    if (c && typeof c.icon === 'function') {
      try { return c.icon(name); } catch (e) { /* noop */ }
    }
    return fallback || '';
  }

  function save() {
    var c = C();
    if (c && typeof c.save === 'function') c.save();
  }

  function emit(name, data) {
    var c = C();
    if (c && typeof c.emit === 'function') c.emit(name, data);
  }

  /* state.plays может отсутствовать в старых сохранениях — создаём лениво. */
  function plays() {
    var c = C();
    if (!c || !c.state) return {};
    var map = c.state.plays;
    if (!map || typeof map !== 'object' || Array.isArray(map)) {
      map = {};
      c.state.plays = map;
    }
    return map;
  }

  /* Геттеры не должны мутировать state — читаем без создания записи. */
  function peek(id) {
    var key = String(id == null ? '' : id);
    if (!key) return null;
    var map = plays();
    var e = map[key];
    if (!e || typeof e !== 'object' || Array.isArray(e)) return null;
    return {
      count: Math.max(0, Math.floor(num(e.count, 0))),
      last: Math.max(0, num(e.last, 0)),
      seconds: Math.max(0, num(e.seconds, 0))
    };
  }

  /* Запись создаём только при реальном событии. */
  function entry(id) {
    var map = plays();
    var key = String(id == null ? '' : id);
    if (!key) return null;
    var e = map[key];
    if (!e || typeof e !== 'object' || Array.isArray(e)) {
      e = { count: 0, last: 0, seconds: 0 };
      map[key] = e;
    }
    e.count = Math.max(0, Math.floor(num(e.count, 0)));
    e.last = Math.max(0, num(e.last, 0));
    e.seconds = Math.max(0, num(e.seconds, 0));
    return e;
  }

  /* ------------------------------------------------------------- public API */

  function count(id) {
    var e = peek(id);
    return e ? e.count : 0;
  }

  function stats(id) {
    var e = peek(id);
    if (!e) return { count: 0, last: 0, seconds: 0, minutes: 0 };
    return {
      count: e.count,
      last: e.last,
      seconds: e.seconds,
      minutes: Math.round(e.seconds / 60)
    };
  }

  /* Единственная точка записи прослушивания.
   * Повторный вызов в течение DEDUPE мс игнорируется — именно так
   * trackchange и state не считают один и тот же старт дважды. */
  function record(id) {
    var key = String(id == null ? '' : id);
    if (!key) return false;
    var map = plays();
    var now = Date.now();
    var e = entry(key);
    if (!e) return false;
    if (e.last && now - e.last < DEDUPE) return false;
    e.count += 1;
    e.last = now;
    map[key] = e;
    save();
    emit('plays', { id: key, count: e.count, last: e.last, seconds: e.seconds });
    injectAll();
    return true;
  }

  function playsWord(n) {
    var mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 14) return 'прослушиваний';
    var mod10 = n % 10;
    if (mod10 === 1) return 'прослушивание';
    if (mod10 >= 2 && mod10 <= 4) return 'прослушивания';
    return 'прослушиваний';
  }

  function badgeHtml(id) {
    var n = count(id);
    if (!n) return '';
    var key = esc(id);
    var glyph = icon('play', '&#9654;');
    return '<span class="plays-badge" data-plays-badge="' + key + '"' +
      ' data-plays-id="' + key + '" data-plays-n="' + n + '"' +
      ' title="' + n + ' ' + playsWord(n) + '">' + glyph +
      '<span class="plays-badge-n">' + n + '</span></span>';
  }

  function fmtDate(ts) {
    var t = num(ts, 0);
    if (!t) return '—';
    var d = new Date(t);
    if (isNaN(d.getTime())) return '—';
    var now = new Date();
    var day = ('0' + d.getDate()).slice(-2);
    var mon = ('0' + (d.getMonth() + 1)).slice(-2);
    if (d.getFullYear() !== now.getFullYear()) {
      return day + '.' + mon + '.' + String(d.getFullYear()).slice(-2);
    }
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var that = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((today - that) / 86400000);
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'вчера';
    return day + '.' + mon;
  }

  function artHtml(track) {
    var av = T.modules && T.modules.Avatar;
    if (av && typeof av.html === 'function') {
      try {
        var h = av.html(track.id, 30);
        if (typeof h === 'string' && h) return '<span class="plays-art">' + h + '</span>';
      } catch (e) { /* fallthrough to color */ }
    }
    var c = C();
    var meta = (c && c.state && c.state.meta && c.state.meta[track.id]) || {};
    var color = /^#[0-9a-f]{3,8}$/i.test(String(meta.color || '')) ? meta.color : '';
    var style;
    if (color) {
      style = 'background:linear-gradient(135deg,' + color + ',#4fb3ff)';
    } else {
      var str = String(track.id || track.title || 'the music');
      var hashv = 2166136261;
      for (var i = 0; i < str.length; i++) {
        hashv ^= str.charCodeAt(i);
        hashv = (hashv * 16777619) >>> 0;
      }
      var hue = hashv % 360;
      style = 'background:linear-gradient(135deg,hsl(' + hue + ',78%,62%),hsl(' +
        ((hue + 48) % 360) + ',82%,46%))';
    }
    return '<span class="plays-art plays-color" style="' + esc(style) + '">' +
      icon('play', '&#9654;') + '</span>';
  }

  function topList() {
    var map = plays();
    var out = [];
    for (var id in map) {
      if (!has(map, id)) continue;
      var n = Math.max(0, Math.floor(num(map[id] && map[id].count, 0)));
      if (!n) continue;
      out.push({
        id: id,
        count: n,
        last: Math.max(0, num(map[id].last, 0)),
        seconds: Math.max(0, num(map[id].seconds, 0))
      });
    }
    out.sort(function (a, b) {
      return b.count - a.count || b.last - a.last || (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
    });
    return out.slice(0, 10);
  }

  function sectionHtml() {
    var list = topList();
    var html = '<div class="plays-section" data-plays-section="1">' +
      '<div class="plays-head">' + icon('play', '&#9654;') +
      '<span>Топ прослушиваний</span></div>';
    if (!list.length) {
      return html + '<div class="plays-empty">Включи трек — здесь появится топ.</div></div>';
    }
    var c = C();
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var track = c && typeof c.getTrack === 'function' ? c.getTrack(item.id) : null;
      var title = track ? (track.title || 'Без названия') : item.id;
      var artist = track && track.artist ? track.artist : '';
      html += '<div class="plays-row" data-plays-id="' + esc(item.id) + '">' +
        '<span class="plays-rank">' + (i + 1) + '</span>' +
        artHtml(track || { id: item.id, title: title }) +
        '<span class="plays-info"><b class="plays-title">' + esc(title) + '</b>' +
        (artist ? '<small class="plays-artist">' + esc(artist) + '</small>' : '') +
        '</span>' +
        '<span class="plays-count">' + icon('play', '&#9654;') + item.count + '</span>' +
        '<span class="plays-date">' + esc(fmtDate(item.last)) + '</span>' +
        '</div>';
    }
    return html + '</div>';
  }

  /* ------------------------------------------------------------- observers */

  /* Накапливаем прослушанные секунды и сбрасываем пачками по 30.
   * delta берётся только из позиции одного и того же трека при playing=true.
   * Перемотка/зацикливание (прыжок >= SEEK_GUARD или позиция уменьшилась)
   * игнорируется — как и пауза. */
  function flushSeconds(id) {
    if (obs.pending < FLUSH) return;
    var whole = Math.floor(obs.pending / FLUSH) * FLUSH;
    obs.pending -= whole;
    var e = entry(id);
    if (!e) return;
    var map = plays();
    e.seconds += whole;
    map[String(id)] = e;
    save();
    emit('plays', { id: String(id), count: e.count, last: e.last, seconds: e.seconds });
  }

  function onState(payload) {
    var c = C();
    if (!c || !c.state) return;
    var p = c.state.player || {};
    var data = payload && typeof payload === 'object' ? payload : null;
    var id = p.currentId != null ? String(p.currentId) : '';
    if (!id && data && data.current && data.current.id) id = String(data.current.id);
    var playing = data && typeof data.playing === 'boolean' ? data.playing : !!p.playing;
    if (!id) {
      /* Нет текущего трека — сбрасываем позицию, но сохраняем prev-id:
       * он нужен как «предыдущий трек» для следующего старта. */
      obs.pos = 0;
      obs.playing = !!playing;
      return;
    }

    var pos = data && typeof data.position === 'number' ? data.position : p.position;
    pos = Math.max(0, num(pos, 0));

    /* Старт нового трека: сменился id и позиция сброшена в 0.
     * Требуем предыдущий id — иначе restored-сессия при запуске
     * дала бы ложный +1. record() отсечёт двойной счёт с trackchange. */
    var changed = !!obs.id && obs.id !== id;
    if (playing && pos <= 0 && changed) record(id);

    if (playing && obs.playing && obs.id === id && pos > obs.pos) {
      var delta = pos - obs.pos;
      if (delta > 0 && delta < SEEK_GUARD) {
        obs.pending += delta / 1000;
        flushSeconds(id);
      }
    }
    obs.id = id;
    obs.pos = pos;
    obs.playing = !!playing;
  }

  function onTrackChange(track) {
    var c = C();
    var id = track && track.id != null ? String(track.id) : '';
    if (!id && c && c.state && c.state.player) id = String(c.state.player.currentId || '');
    if (!id) return;
    record(id);
    /* Новый трек всегда начинается с нуля — сбрасываем базу дельты,
     * иначе следующий state посчитает разрыв между треками как «прослушано». */
    obs.id = id;
    obs.pos = 0;
    obs.pending = 0;
    obs.playing = true;
  }

  /* ------------------------------------------------------------- DOM inject */

  function q(sel) {
    return typeof document !== 'undefined' && document.querySelector ? document.querySelector(sel) : null;
  }

  function insertHtmlAfter(anchor, html) {
    if (!anchor || !anchor.parentNode || !html) return;
    var box = document.createElement('span');
    box.innerHTML = html;
    var node = box.firstChild;
    if (!node) return;
    if (anchor.nextSibling) anchor.parentNode.insertBefore(node, anchor.nextSibling);
    else anchor.parentNode.appendChild(node);
  }

  function currentTrackId() {
    var c = C();
    var p = c && c.state && c.state.player;
    return p && p.currentId != null ? String(p.currentId) : '';
  }

  function routeTrackId() {
    var c = C();
    var s = c && c.state;
    var id = s && s.routeParams && s.routeParams.id != null ? String(s.routeParams.id) : '';
    if (!id && s && s.selectedTrackId != null) id = String(s.selectedTrackId);
    return id || currentTrackId();
  }

  function mountBadge(host, id) {
    if (!host || !id) return;
    var key = String(id);
    var n = count(key);
    var old = host.querySelector('.plays-badge');
    if (old && old.getAttribute('data-plays-id') === key &&
        Number(old.getAttribute('data-plays-n')) === n) return;
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var html = badgeHtml(key);
    if (!html) return;
    var anchor = host.querySelector('.pl-head-title') ||
      host.querySelector('.tm-head h1') ||
      host.querySelector('.screen-head h1') ||
      host.querySelector('h1');
    insertHtmlAfter(anchor, html);
  }

  function mountSection(host) {
    if (!host) return;
    var html = sectionHtml();
    var sig = html.replace(/<[^>]*>/g, '').slice(0, 400);
    var old = host.querySelector('[data-plays-section]');
    if (old && old.getAttribute('data-plays-sig') === sig) return;
    if (old && old.parentNode) old.parentNode.removeChild(old);
    /* Подпись храним атрибутом, сам HTML не меняем. */
    var box = document.createElement('div');
    box.innerHTML = html;
    var node = box.firstChild;
    if (!node) return;
    node.setAttribute('data-plays-sig', sig);
    host.appendChild(node);
  }

  function injectAll() {
    if (typeof document === 'undefined' || !document.querySelector) return;
    mountBadge(q('[data-screen="track"]'), routeTrackId());
    mountBadge(q('[data-screen="player"]'), currentTrackId());
    mountSection(q('[data-screen="home"]'));
    mountSection(q('[data-screen="settings"]'));
  }

  function injectCss() {
    if (typeof document === 'undefined' || !document.head) return;
    if (document.getElementById('tm-plays-css')) return;
    var st = document.createElement('style');
    st.id = 'tm-plays-css';
    st.textContent = [
      '.plays-badge{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;',
      'padding:3px 9px;border-radius:999px;font:700 11px/1.3 inherit;',
      'color:#dedbff;background:rgba(139,123,255,.18);border:1px solid rgba(139,123,255,.34);',
      'font-variant-numeric:tabular-nums;white-space:nowrap}',
      '.plays-badge svg{width:12px;height:12px;fill:currentColor;stroke:none}',
      '.plays-section{margin:20px 16px 12px;padding:14px;border-radius:18px;',
      'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}',
      '.plays-head{display:flex;align-items:center;gap:8px;margin:0 2px 11px;',
      'font-size:15px;font-weight:800;color:#e8e4ff}',
      '.plays-head svg{width:16px;height:16px;fill:currentColor;stroke:none}',
      '.plays-empty{font-size:12px;opacity:.6;padding:10px 2px}',
      '.plays-row{display:flex;align-items:center;gap:9px;min-height:46px;padding:5px 4px;',
      'border-bottom:1px solid rgba(255,255,255,.06)}',
      '.plays-row:last-child{border-bottom:0}',
      '.plays-rank{width:16px;flex:0 0 16px;font-size:11px;opacity:.55;text-align:center}',
      '.plays-art{width:30px;height:30px;min-width:30px;border-radius:9px;overflow:hidden;',
      'display:inline-flex;align-items:center;justify-content:center}',
      '.plays-art img{width:100%;height:100%;object-fit:cover}',
      '.plays-art svg{width:13px;height:13px;color:rgba(255,255,255,.9);fill:currentColor;stroke:none}',
      '.plays-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}',
      '.plays-title{font-size:12.5px;color:#f2f0ff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}',
      '.plays-artist{font-size:10.5px;opacity:.55;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}',
      '.plays-count{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;',
      'color:#c9c0ff;font-variant-numeric:tabular-nums}',
      '.plays-count svg{width:11px;height:11px;fill:currentColor;stroke:none}',
      '.plays-date{font-size:10px;opacity:.5;min-width:48px;text-align:right}'
    ].join('\n');
    document.head.appendChild(st);
  }

  /* -------------------------------------------------------------- lifecycle */

  function init() {
    if (inited) { injectAll(); return; }
    if (typeof document === 'undefined' || !document.body) return;
    inited = true;
    if (module) module['data-init'] = '1';
    injectCss();

    var c = C();
    /* Базируем наблюдатель на текущем состоянии: restored-сессия
     * не должна давать ложный +1 на первом же state-событии. */
    if (c && c.state && c.state.player) {
      var p = c.state.player;
      obs.id = p.currentId != null ? String(p.currentId) : '';
      obs.pos = Math.max(0, num(p.position, 0));
      obs.playing = !!p.playing;
    }
    if (c && typeof c.on === 'function') {
      c.on('trackchange', onTrackChange);
      c.on('state', onState);
      c.on('route', function () {
        injectAll();
        /* main.js вызывает renderSettings() ещё раз уже после route —
           поэтому повторяем инъекцию на следующем тике. */
        if (window.setTimeout) window.setTimeout(injectAll, 0);
      });
      c.on('library', function () {
        injectAll();
        if (window.setTimeout) window.setTimeout(injectAll, 0);
      });
      c.on('ready', function () {
        if (window.setTimeout) window.setTimeout(injectAll, 0);
      });
      c.on('plays', injectAll);
    }
    injectAll();
  }

  module = {
    init: init,
    count: count,
    record: record,
    stats: stats,
    badgeHtml: badgeHtml,
    sectionHtml: sectionHtml
  };

  T.modules = T.modules || {};
  T.modules.Plays = module;
  T.Plays = module; /* на случай, если координатор держит API через T.Plays */

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { if (!inited) init(); });
    } else if (window.setTimeout) {
      window.setTimeout(function () { if (!inited) init(); }, 0);
    }
  }
})();


/* ===== gestures.js ===== */
'use strict';
/*
 * The Music v1.2 — модуль свайпов (АГЕНТ 2)
 * Публичный API: TheMusic.modules.Gestures = { init, attach }
 *
 * Жесты:
 *   1) player + старт в верхних 25% + свайп вниз  -> Core.go('home')
 *   2) старт у левого края (x <= 28) + свайп вправо -> Core.back()
 *   3) строка трека + свайп влево (>= 70px)        -> шторка .swipe-actions
 *
 * Вертикальный скролл НЕ блокируется: preventDefault вызывается только в
 * не-passive touchmove и только после точного распознавания горизонтального жеста.
 */

(function () {
  'use strict';

  var T = (typeof window !== 'undefined' && window.TheMusic)
    ? window.TheMusic
    : (typeof window !== 'undefined' ? (window.TheMusic = {}) : {});
  T.modules = T.modules || {};

  /* Без DOM (например, юнит-тест в Node) модуль есть, но ничего не делает. */
  if (typeof document === 'undefined' || !document || !document.addEventListener) {
    T.modules.Gestures = {
      init: function () {},
      attach: function () { return function () {}; }
    };
    return;
  }

  var doc = document;
  var root = doc.documentElement;

  var IGNORE_SEL = 'input, textarea, select, [data-no-swipe], .range, input[type=range]';
  var ROW_SEL = '[data-track-id], .track-row, [data-play]';
  var EDGE = 28;         // старт свайпа «назад» у левого края
  var THRESHOLD = 60;    // общий порог жеста
  var ROW_THRESHOLD = 70;// порог шторки действий над строкой трека
  var RATIO = 1.3;       // горизонтальный приоритет: |dx| > |dy| * 1.3
  var HINT_MS = 560;
  var ACTIONS_MS = 6500;

  var inited = false;
  var active = null;       // текущий жест
  var suppressUntil = 0;   // подавление «призрачного» click после свайпа
  var suppressRow = null;
  var open = null;         // открытая шторка / пикер
  var openTimer = null;
  var hintNodes = [];
  var hintTimer = null;
  var registry = [];       // элементы, подключённые через attach(el, opts)

  /* ---------------- базовые утилиты (без Element.closest / ES6) ---------------- */

  function core() {
    return T.Core || (typeof window !== 'undefined' && window.Core) || {};
  }

  function state() {
    var c = core();
    return (c && c.state) || T.state || {};
  }

  function callCore(name, args) {
    var c = core();
    if (c && typeof c[name] === 'function') {
      try { return c[name].apply(c, args || []); } catch (e) { /* degraade gracefully */ }
    }
    return undefined;
  }

  function goHome() {
    var Core = core();
    if (Core && typeof Core.go === 'function') {
      try { Core.go('home'); } catch (e) { /* ignore */ }
    }
  }

  function goBack() {
    var Core = core();
    if (Core && typeof Core.back === 'function') {
      try { Core.back(); } catch (e) { /* ignore */ }
    }
  }

  function toggleFav(id) {
    var Core = core();
    if (Core && typeof Core.toggleFav === 'function') {
      try { return Core.toggleFav(id); } catch (e) { return false; }
    }
    return false;

  function normType(type) {

  /* ------------------------------------------------------------------ */
  /* Локальный поиск (работает всегда, даже без Api и без сети)           */
  /* ------------------------------------------------------------------ */

  function localSearch(q) {
    var query = String(q || '').toLowerCase();
    var s = state();
    var tracks = Array.isArray(s.tracks) ? s.tracks : [];
    var playlists = Array.isArray(s.playlists) ? s.playlists : [];
    var artists = {};
    var songs = [];
    var lists = [];
    var i, j, track, meta, hay, artist;

    for (i = 0; i < tracks.length; i++) {
      track = tracks[i];
      if (!track) continue;
      meta = (s.meta && s.meta[track.id]) || {};
      hay = [track.title, track.artist, track.album, track.path,
        meta.description, meta.author, meta.note,
        (meta.tags || []).join(' ')].join(' ').toLowerCase();

      if (!query || hay.indexOf(query) >= 0) {
        songs.push(normSong(track));
      }
      artist = String(track.artist || 'Неизвестно');
      if (!query || artist.toLowerCase().indexOf(query) >= 0) {
        if (!artists[artist]) artists[artist] = { id: artist, name: artist, count: 0, type: 'artist' };
        artists[artist].count++;
      }
    }

    for (j = 0; j < playlists.length; j++) {
      var pl = playlists[j];
      if (!pl) continue;
      hay = String(pl.name || '').toLowerCase();
      if (!query || hay.indexOf(query) >= 0) lists.push(normPlaylist(pl));
    }

    /* Опубликованное, которого может не быть в локальной медиатеке. */
    var pub = publishedList();
    for (i = 0; i < pub.length; i++) {
      var rec = pub[i];
      if (!rec || typeof rec !== 'object') continue;
      hay = [rec.title, rec.description, (rec.tags || []).join(' '),
        rec.id, rec.type].join(' ').toLowerCase();
      if (query && hay.indexOf(query) < 0) continue;
      if (normType(rec.type) === 'song') {
        if (!findById(songs, String(rec.id))) {
          var localTrack = typeof core().getTrack === 'function' ? core().getTrack(rec.id) : null;
          songs.push(normSong(localTrack || {
            id: rec.id, title: rec.title || 'Без названия',
            artist: rec.author || 'Неизвестно'
          }));
        }
      } else if (normType(rec.type) === 'playlist') {
        if (!findById(lists, String(rec.id))) {
          lists.push(normPlaylist({ id: rec.id, name: rec.title || 'Плейлист' }));
        }
      }
    }

    return {
      artists: Object.keys(artists).map(function (k) { return artists[k]; })
        .sort(function (a, b) { return b.count - a.count; }).slice(0, LIMIT_ARTISTS),
      songs: songs.slice(0, LIMIT_SONGS),
      playlists: lists.slice(0, LIMIT_PLAYLISTS)
    };
  }

  function findById(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i] && String(list[i].id) === String(id)) return list[i];
    }
    return null;
  }

  function normArtist(item) {
    if (item == null) return null;
    if (typeof item === 'string') return { id: item, name: item, count: 0, type: 'artist' };
    if (typeof item !== 'object') return null;
    var name = item.name || item.username || item.login || item.title || '';
    var id = item.id != null ? item.id : (item.username || item.login || name);
    if (!name && !id) return null;
    return {
      id: String(id),
      name: String(name || id),
      count: Math.max(0, Math.round(num(item.tracks || item.trackCount || item.count || item.songs, 0))),
      type: 'artist',
      remote: true

  }

  function normSong(item) {
    if (!item || typeof item !== 'object') return null;
    var id = item.id != null ? item.id : (item.songId != null ? item.songId : item.trackId);
    var title = item.title || item.name;
    if (id == null && !title) return null;
    return {
      id: String(id == null ? title : id),
      title: String(title || 'Без названия'),
      artist: String(item.artist || item.author || 'Неизвестно'),
      album: String(item.album || ''),

    if (!incoming) return out;
    var groups = [['artists', 'name'], ['songs', 'id'], ['playlists', 'id']];
    for (var g = 0; g < groups.length; g++) {
      var field = groups[g][0];
      var key = groups[g][1];
      var added = incoming[field] || [];
      for (var i = 0; i < added.length; i++) {

        var exists = false;

  function homeBarHtml() {

      '<input class="discover-input" type="search" data-discover-input ' +
      'placeholder="Поиск исполнителей и песен…" aria-label="Поиск исполнителей и песен" ' +
      'autocomplete="off" data-no-swipe="1">' +

      '</div>' +

      '<span class="discover-card-ico">' + icon('playlist') + '</span>' +
      '<span class="discover-card-text"><b>' + esc(pl.name || 'Плейлист') + '</b>' +

  function resultsHtml(results, query, source) {
    if (!query) {
      return '<p class="discover-hint">Начни вводить имя или название — найдём и на устройстве, ' +
        'и на сервере.</p>';
    }
    var status = source === 'remote'
      ? 'Результаты с сервера и из медиатеки'
      : source === 'error' ? 'Сервер недоступен — показан локальный поиск'
        : source === 'pending' ? 'Ищем на сервере…' : 'Локальный поиск';
    var html = '<div class="discover-status">' + esc(status) + '</div>';
    html += sectionHtml('Исполнители', (results.artists || []).map(artistCard).join(''));
    html += sectionHtml('Песни', (results.songs || []).map(songCard).join(''));
    html += sectionHtml('Плейлисты', (results.playlists || []).map(playlistCard).join(''));
    return html;
  }

  function renderResults(results, query, source) {
    var box = resultsBox();
    if (!box) return;
    box.innerHTML = resultsHtml(results || emptyResults(), query, source);

  function resultsBox() {

    if (!doc || !doc.querySelector) return null;

  /* ------------------------------------------------------------------ */
  /* Инъекция поисковой строки                                           */
  /* ------------------------------------------------------------------ */

  function scheduleInject() {

      injectHomeBar();

  function injectHomeBar() {

    if (!screen) return;

    var host = screen.querySelector ? screen.querySelector('[data-discover-host]') : null;
    if (!host) {
      host = doc.createElement('div');
      host.className = 'discover-host';
      host.setAttribute('data-discover-host', '1');
      host.innerHTML = homeBarHtml();

      var body = screen.querySelector('.screen-body');
      if (!body) {
        body = doc.createElement('div');
        body.className = 'screen-body';
        screen.insertBefore(body, screen.firstChild);
      }
      body.insertBefore(host, body.firstChild);

      var input = host.querySelector('[data-discover-input]');
      if (input) input.value = lastQuery;
      if (lastQuery || lastResults) renderResults(lastResults || emptyResults(), lastQuery, lastSource);

          return;

      });
      observer.observe(screen, { childList: true, subtree: false });
      observedScreen = screen;
    } catch (e) {
      observer = null;
      observedScreen = null;
    }

  /* ------------------------------------------------------------------ */
  /* Поиск                                                              */
  /* ------------------------------------------------------------------ */

  /* Только хелперы агента 9 — никаких самопальных путей. */
  function remoteCall(A, helper, q) {

  function search(q) {

    if (!query || !A || typeof A.request !== 'function') return local;
    if (!apiOnline(A)) {

    }

    var generation = searchSeq;
    var merged = { artists: local.artists.slice(), songs: local.songs.slice(), playlists: local.playlists.slice() };
    var pending = 3;
    var anyOk = false;
    lastSource = 'pending';
    renderResults(merged, query, lastSource);

    var tasks = [
      { helper: 'searchArtist', type: 'artist' },
      { helper: 'searchSong', type: 'song' },
      { helper: 'searchPlaylist', type: 'playlist' }
    ];

    function finish() {
      pending--;
      if (generation !== searchSeq) return;
      if (pending > 0) return;
      lastResults = merged;
      lastSource = anyOk ? 'remote' : 'error';
      renderResults(merged, query, lastSource);
    }

    for (var i = 0; i < tasks.length; i++) {
      (function (task) {
        var promise = remoteCall(A, task.helper, query);
        if (!promise) { finish(); return; }
        settle(promise, function (data) {
          if (generation !== searchSeq) return;
          var found = normalizeRemote(data, task.type);
          if (found.length) {
            anyOk = true;
            merged = mergeResults(merged, (function () {
              var box = emptyResults();
              box[task.type === 'artist' ? 'artists' : task.type === 'song' ? 'songs' : 'playlists'] = found;
              return box;
            })());
          }
          finish();
        }, function () {
          finish();
        });
      })(tasks[i]);
    }

    return merged;
  }

  function onInput(event) {
    var target = event.target;
    if (!target || !target.getAttribute) return;
    if (target.getAttribute('data-discover-input') === null) return;
    var value = String(target.value || '');
    if (debounceTimer) window.clearTimeout(debounceTimer);
    debounceTimer = window.setTimeout(function () {
      debounceTimer = null;
      search(value);
    }, DEBOUNCE_MS);
  }

  function onKeydown(event) {
    var target = event.target;
    if (!target || !target.getAttribute) return;
    if (target.getAttribute('data-discover-input') === null) return;
    if (event.key === 'Enter' || event.keyCode === 13) {
      if (event.preventDefault) event.preventDefault();
      if (debounceTimer) window.clearTimeout(debounceTimer);
      debounceTimer = null;
      search(target.value);
    } else if (event.key === 'Escape' || event.keyCode === 27) {
      if (debounceTimer) window.clearTimeout(debounceTimer);
      debounceTimer = null;
      clearSearch();
    }
  }

  function clearSearch() {
    lastQuery = '';
    lastResults = null;
    lastSource = '';
    searchSeq++;
    renderResults(emptyResults(), '', '');
    var input = resultsBox() && homeScreen().querySelector('[data-discover-input]');
    if (input) {
      input.value = '';
      if (typeof input.focus === 'function') input.focus();
    }
  }

  /* ------------------------------------------------------------------ */
  /* Действия карточек                                                   */
  /* ------------------------------------------------------------------ */

  function playSong(id) {
    var C = core();
    if (!C) return;
    var track = typeof C.getTrack === 'function' ? C.getTrack(id) : null;
    if (!track) {
      toast('Трека нет на устройстве');
      return;
    }
    var ids = [];
    var seen = {};
    seen[String(track.id)] = true;
    ids.push(String(track.id));

    var resultsSongs = lastResults && lastResults.songs ? lastResults.songs : [];
    var i, candidate, local;
    for (i = 0; i < resultsSongs.length; i++) {
      candidate = resultsSongs[i];
      if (!candidate || seen[String(candidate.id)]) continue;
      local = typeof C.getTrack === 'function' ? C.getTrack(candidate.id) : null;
      if (local) {
        seen[String(candidate.id)] = true;
        ids.push(String(candidate.id));
      }
    }
    if (ids.length < 2) {
      var all = Array.isArray(state().tracks) ? state().tracks : [];
      for (i = 0; i < all.length; i++) {
        if (!all[i] || seen[String(all[i].id)]) continue;
        seen[String(all[i].id)] = true;
        ids.push(String(all[i].id));
      }
    }

    var Player = module('Player');
    if (Player && typeof Player.setQueue === 'function') Player.setQueue(ids);
    else state().queueIds = ids.slice();
    if (Player && typeof Player.play === 'function') Player.play(track);
    else if (typeof C.native === 'function') C.native('play', JSON.stringify(track));
    if (typeof C.go === 'function') C.go('player');
    if (typeof C.save === 'function') C.save();
  }

  function openCard(raw) {
    var parts = String(raw || '').split('|');
    var type = normType(parts[0]) || 'song';
    var id = parts.slice(1).join('|');
    var C = core();
    if (!C || !id) return;
    if (type === 'playlist' && findLocalPlaylist(id)) {
      C.go('playlist', { id: id });
    } else if (type === 'song' && typeof C.getTrack === 'function' && C.getTrack(id)) {
      C.go('track', { id: id });
    } else {
      toast('Нет на устройстве — доступно только после синхронизации');
    }
  }

  /* ------------------------------------------------------------------ */
  /* Публикация                                                          */
  /* ------------------------------------------------------------------ */

  function describe(type, id) {
    var t = normType(type) || 'song';
    var item = t === 'playlist' ? findLocalPlaylist(id)
      : (core() && typeof core().getTrack === 'function' ? core().getTrack(id) : null);
    if (item) {
      return {
        title: String(item.name || item.title || 'Без названия'),
        subtitle: t === 'playlist'
          ? ((item.trackIds || []).length + ' треков')
          : String(item.artist || 'Неизвестно')
      };
    }
    var rec = findPublished(t, id);
    return {
      title: rec && rec.title ? String(rec.title) : 'Без названия',
      subtitle: t === 'playlist' ? 'Плейлист' : 'Трек'
    };
  }

  function closeSheet() {
    if (!sheet) return;
    if (sheet.parentNode) sheet.parentNode.removeChild(sheet);
    sheet = null;
  }

  function openPublishSheet(type, id) {
    if (!doc || !doc.createElement) return;
    closeSheet();
    var root = doc.getElementById('overlay-root') || doc.body;
    if (!root) return;
    var info = describe(type, id);

    var wrap = doc.createElement('div');
    wrap.className = 'discover-overlay';
    wrap.setAttribute('data-publish-overlay', '1');
    wrap.setAttribute('data-pub-type', type);
    wrap.setAttribute('data-pub-id', String(id));
    wrap.innerHTML =
      '<div class="sheet publish-sheet" role="dialog" aria-modal="true" ' +
      'aria-label="Публикация">' +
      '<button type="button" class="sheet-close" data-pub-cancel="1" aria-label="Закрыть">' +
      icon('close') + '</button>' +
      '<h2 class="sheet-title">Опубликовать для всех?</h2>' +
      '<p class="publish-lead">' + esc(info.title) + '<small>' + esc(info.subtitle) + '</small></p>' +
      '<label class="field publish-field">' +
      '<span class="field-label">Описание</span>' +
      '<textarea class="input publish-desc" data-pub-desc rows="3" ' +
      'placeholder="Расскажи, почему это стоит послушать" data-no-swipe="1"></textarea>' +
      '</label>' +
      '<label class="field publish-field">' +
      '<span class="field-label">Теги (через запятую)</span>' +
      '<input class="input publish-tags" data-pub-tags type="text" ' +
      'placeholder="музыка, rock, 2026" autocomplete="off" data-no-swipe="1">' +
      '</label>' +
      '<div class="publish-actions">' +
      '<button type="button" class="btn" data-pub-cancel="1">Отмена</button>' +
      '<button type="button" class="btn primary" data-pub-confirm="1">' +
      icon('share') + '<span>Опубликовать</span></button>' +
      '</div></div>' +
      '<div class="backdrop" data-pub-cancel="1"></div>';
    root.appendChild(wrap);
    sheet = wrap;

    var desc = wrap.querySelector ? wrap.querySelector('[data-pub-desc]') : null;
    if (desc && typeof desc.focus === 'function') desc.focus();
  }

  function splitTags(raw) {
    var parts = String(raw || '').split(/[,;#]/);
    var out = [];
    var seen = {};
    for (var i = 0; i < parts.length; i++) {
      var tag = parts[i].replace(/^\s+|\s+$/g, '').replace(/^#/, '');
      if (!tag || seen[tag.toLowerCase()]) continue;
      seen[tag.toLowerCase()] = true;
      out.push(tag.slice(0, 32));
      if (out.length >= 12) break;
    }
    return out;
  }

  function addPublished(type, id, meta, response) {
    var s = state();
    if (!Array.isArray(s.published)) s.published = [];
    var key = keyOf(type, id);
    var info = describe(type, id);
    var account = s.account || {};
    var rec = {
      key: key,
      type: type,
      id: String(id),
      title: info.title,
      description: String(meta.description || ''),
      tags: meta.tags || [],
      author: String(account.name || ''),
      publishedAt: Date.now()
    };
    if (response && typeof response === 'object') {
      if (response.id != null) rec.remoteId = String(response.id);
      if (response.url) rec.url = String(response.url);
      else if (response.link) rec.url = String(response.link);
    }
    var list = s.published;
    var found = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i] && String(list[i].key || keyOf(list[i].type, list[i].id)) === key) {
        list[i] = rec;
        found = true;
        break;
      }
    }
    if (!found) list.push(rec);

    statsBucket(key);
    if (typeof core().save === 'function') core().save();
    return rec;
  }

  function publish(type, id) {
    var t = normType(type);
    var sid = id == null ? '' : String(id);
    if (!t || !sid) return false;
    if (!loggedIn()) {
      toast('Нужен аккаунт');
      openAuth();
      return false;
    }
    openPublishSheet(t, sid);
    return true;
  }

  function confirmPublish() {
    if (publishing || !sheet) return;
    var type = normType(sheet.getAttribute('data-pub-type')) || 'song';
    var id = String(sheet.getAttribute('data-pub-id') || '');
    if (!id) { closeSheet(); return; }

    var A = api();
    var helper = type === 'song' ? 'publishSong' : 'publishPlaylist';
    if (!A || typeof A[helper] !== 'function') {
      closeSheet();
      emit('publishfailed', { type: type, id: id, reason: 'no-api' });
      return;
    }
    var descEl = sheet.querySelector ? sheet.querySelector('[data-pub-desc]') : null;
    var tagsEl = sheet.querySelector ? sheet.querySelector('[data-pub-tags]') : null;
    var meta = {
      description: descEl ? String(descEl.value || '').slice(0, 600) : '',
      tags: splitTags(tagsEl ? tagsEl.value : ''),
      author: String((state().account || {}).name || '')

    /* Хелпер Api сам вешает Bearer, кладёт token в body и показывает
